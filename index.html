// ================= GHEAȚĂ (lacurile înghețate din nivelul 4) =================
// Fiecare tile de gheață strânge „crăpături” cât timp curcanul stă pe el și se vindecă încet când pleacă — așa
// că mersul peste lac nu o crapă, dar dacă stai ~2 s pe același loc, crăpăturile cresc (cu trosnete) și gheața de
// sub tine se sparge: devine apă și cazi. După ~5 s gaura îngheață la loc.
const ICE_CRACK_T=120,ICE_HEAL=0.6,ICE_REFREEZE_T=300,ICE_ACC=0.2,ICE_FRICTION=0.1;
let iceCrack=new Float32Array(0),iceHole=new Int16Array(0),iceTouch=new Int32Array(0);
function onIce(e){return e.onGround&&tileAt(Math.floor((e.x+e.w/2)/TS),Math.floor((e.y+e.h+1)/TS))==='I';}
function iceUnder(e){const ty=Math.floor((e.y+e.h+1)/TS),out=[];
  for(let tx=Math.floor(e.x/TS);tx<=Math.floor((e.x+e.w-1)/TS);tx++)if(tileAt(tx,ty)==='I')out.push(tx);return out;}
function iceStage(tx){const c=iceCrack[tx]/ICE_CRACK_T;return c>0.8?3:c>0.5?2:c>0.2?1:0;}
function stepOnIce(under){
  let brk=false;
  for(const tx of under){const s0=iceStage(tx);iceCrack[tx]++;iceTouch[tx]=G.frame;
    if(iceStage(tx)>s0)sfx.crack();
    if(iceCrack[tx]>=ICE_CRACK_T)brk=true;}
  // Se sparge tot ce e sub picioare deodată, ca să cazi sigur (nu să rămâi sprijinit pe tile-ul vecin).
  if(brk){for(const tx of under)breakIce(tx,true);sfx.iceBreak();}
}
// quiet: fără sunet (când se sparg mai multe tile-uri deodată, sunetul se pune o singură dată).
function breakIce(tx,quiet){
  grid[12][tx]='.';iceCrack[tx]=0;iceHole[tx]=ICE_REFREEZE_T;
  for(let i=0;i<7;i++)parts.push({x:tx*TS+2+Math.random()*12,y:12*TS+1,vx:(Math.random()-0.5)*2.4,vy:-1.5-Math.random()*2,g:0.25,life:30,max:30,col:i%2?'#ffffff':'#bfe6f8',s:2,edge:'#7ab0d0'});
  if(!quiet)sfx.iceBreak();
}
function updateIce(){
  for(let tx=0;tx<cols;tx++){
    if(iceCrack[tx]>0&&iceTouch[tx]!==G.frame)iceCrack[tx]=Math.max(0,iceCrack[tx]-ICE_HEAL);
    if(iceHole[tx]>0&&--iceHole[tx]===0){
      // Nu îngheață peste curcan cât timp e chiar în gaură (căzând) — mai așteaptă puțin. Ce s-a scufundat
      // rămâne sub gheață, în lac.
      const box={x:tx*TS,y:12*TS,w:TS,h:ICE_SLAB};
      if(!player.dead&&overlap(player,box))iceHole[tx]=1;
      else{grid[12][tx]='I';
        for(let i=0;i<5;i++)parts.push({x:tx*TS+2+Math.random()*12,y:12*TS-1-Math.random()*3,vx:0,vy:-0.3,g:0,life:20,max:20,col:'#ffffff',s:1});
        if(tx*TS>cam.x-TS&&tx*TS<cam.x+W)sfx.freeze();}
    }
  }
}

// Un mob nou care stă pe tile-ul (tx,ty) — ty e rândul în care stă, deasupra solului.
// Ucenicul ('boy') e tot un fermier (type 'man', cu boy:true), ca să moară, să se scufunde și să
// rănească la fel; diferă doar mersul (vezi updateMan), sprite-ul și punctele (vezi killMan).
function makeEnemy(type,tx,ty){return type==='man'||type==='boy'
  ?{type:'man',boy:type==='boy',x:tx*TS+3,y:(ty+1)*TS-18,w:10,h:18,vx:0,vy:0,dir:-1,active:false,dead:0,deadT:0,anim:0,chasing:false,alert:0,atk:0,cd:0,onGround:false}
  :{type:'bomb',x:tx*TS+2,y:(ty+1)*TS-12,w:12,h:12,vx:0,vy:0,dir:-1,active:false,lit:0,sit:false,slideDir:0,slideT:0,kickT:0,anim:0,onGround:false};}
function newGame(){G.carryBig=false;G.carryFire=false;G.carryIce=false;G.lives=3;G.score=0;G.coins=0;G.level=0;G.cp=null;G.slotUsed=null;G.tip=null;toIntro(true);stopSong();}
// Sfaturile de pe ecranul de dinaintea nivelului, alese la întâmplare (niciodată același de două ori la rând).
// Prima dată când intri într-un nivel, sfatul e despre nivelul ăla (tip-ul lui, plus cele pentru noapte / iarnă);
// după ce pierzi o viață, poate fi și unul general. „fire” = despre boaba roșie, care iarna nu apare (acolo e afina).
// Sfaturile sunt scurte și simple: o singură idee, pe un singur rând (cel mult ~40 de caractere).
const TIPS={
  all:['Ține apăsat SPACE ca să sari mai sus.','Ține apăsat X ca să fugi.','50 de bănuți îți dau o viață în plus.',
    'Sari pe bombă, apoi împinge-o!','Bombele explodează! Nu sta lângă ele.','Ai grijă la atacul fermierilor cu furca.',
    'Ucenicii nu te urmăresc.','Curcanul nu știe să înoate!','Timpul rămas se face puncte bonus.','Ferește-te de țepi!'],
  fire:['Boaba roșie îți dă pene de foc.','Apasă scurt X ca să arunci pene.'],
  night:['Strecoară-te prin spatele fermierilor.','Ucenicii n-au felinar.'],
  snow:['Pe gheață aluneci.','Sari peste copcile cu steguleț roșu.','Afina înghețată îți dă pene de gheață.',
    'Dușmanii înghețați se pot împinge.','Fermierii nu calcă pe gheață.','Exploziile sparg gheața.'],
  level:{0:['Lovește blocurile M cu capul.'],2:['Unele platforme se mișcă: așteaptă-le!'],
    3:['În cafenea, timpul stă pe loc.','Blocul mare din cafenea e un slot!'],
    4:['Pădurea e lungă: are două steaguri.'],5:['Intră pe ușa restaurantului!','Fermierul-Șef obosit? Sari-i în cap!']},
};
function pickTip(first){
  const def=LEVELS[G.level],th=THEMES[def.theme];
  const own=[def.tip,...(TIPS.level[G.level]||[]),...(th.night?TIPS.night:[]),...(th.snow?TIPS.snow:[])].filter(Boolean);
  const all=own.concat(TIPS.all,th.snow?[]:TIPS.fire);
  const pool=(first||Math.random()<0.4?own:all).filter(t=>t!==G.tip);
  return pool.length?pool[Math.random()*pool.length|0]:def.tip;
}
// Numărul nivelului i, cum îl vede jucătorul: nivelul bonus nu se numără (Pădurea de brazi rămâne nivelul 4).
const levelNum=i=>LEVELS.slice(0,i+1).filter(d=>!d.bonus&&!d.arena).length;
const levelTag=i=>LEVELS[i].bonus?'BONUS':String(levelNum(i));
// Ecranul de dinaintea nivelului; first = intri prima dată în nivel (nu după ce ai pierdut o viață).
function toIntro(first){G.state='intro';G.stateT=0;G.tip=pickTip(first);}
// quiet = doar pregătește nivelul, fără muzică (modul de test îl folosește ca să facă pozele nivelurilor pentru panou).
function startLevel(quiet){
  const def=LEVELS[G.level],m=def.build();
  grid=m.grid;cols=m.w;theme=THEMES[def.theme];tiles=getTiles(def.theme);bg=getBG(def.theme);goal=m.goalDef;
  enemies=m.ents.map(d=>makeEnemy(d.type,d.x,d.y));
  G.frame=0;plats=m.plats.map(makePlat);boss=m.bossDef?makeBoss(m.bossDef):null;cafe=m.cafeDef?makeCafe(m.cafeDef):null;G.doorT=0;G.inCafe=false;G.talk=null;
  // Mobii puși pe o platformă care se mișcă stau pe ea de la început (și sunt duși cu ea chiar înainte să se „trezească”).
  for(const e of enemies){const p=plats.find(p=>Math.abs(p.y-(e.y+e.h))<1&&e.x+e.w>p.x&&e.x<p.x+p.w);if(p)e.plat=p;}
  coins=m.coins.map(([x,y])=>({x:x*TS+8,y:y*TS+8,taken:false}));
  items=[];parts=[];popups=[];booms=[];bumps=[];feathers=[];
  iceCrack=new Float32Array(cols);iceHole=new Int16Array(cols);iceTouch=new Int32Array(cols);
  const atCp=G.cp&&G.cp.level===G.level;
  // La reapariție, punctele de salvare până la cel atins sunt deja ridicate (altfel, cu două pe nivel, curcanul
  // ar „trece” imediat pe lângă primul și salvarea s-ar muta înapoi la el).
  cps=m.cps.map(x=>{const done=atCp&&x<=G.cp.x;return {x:x*TS,tx:x,on:done,raise:done?1:0};});
  const sx=atCp?G.cp.x*TS+3:2*TS+3;
  const big=!!G.carryBig;
  player={x:sx,y:12*TS-(big?20:13),w:big?12:10,h:big?20:13,big,fire:big&&!!G.carryFire,ice:big&&!!G.carryIce,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,inv:0,anim:0,combo:0,dead:false,alpha:1};
  G.growT=0;
  G.time=300;G.frame=0;G.paused=false;G.tally=0;
  cam.x=clamp(player.x-W*0.4,0,cols*TS-W);
  lakeLife=initLakeLife();
  G.state='play';if(quiet)return;
  playSong(def.song||'main');
  applyAudio();
  if(TEST)testMap();
}

// ================= FX HELPERS =================
function addScore(n,x,y){G.score+=n;if(x!==undefined)popups.push({x,y,s:String(n),t:45,c:'#fff'});}
function popup(s,x,y,c='#ffd23f'){popups.push({x,y,s,t:60,c});}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-0.5)*1.5,vy:-Math.random()*0.8,g:0.02,life:18,max:18,col:'#efe6d6',s:2});}
// ================= APĂ ÎN GROPI =================
// Coloanele fără sol pe rândul 12 sunt gropi cu apă: suprafața e la 5px sub nivelul solului.
const WATER_Y=12*TS+5;
function overPit(e){return tileAt(Math.floor((e.x+e.w/2)/TS),12)==='.';}
function splash(x){
  const w=theme.water;
  for(let i=0;i<12;i++)parts.push({x:x+(Math.random()-0.5)*8,y:WATER_Y-1,vx:(Math.random()-0.5)*2.2,vy:-1.5-Math.random()*2.5,g:0.22,life:28,max:28,col:i%3?w.top:w.foam,s:2});
  sfx.splash();
  scareDucks(x);   // pe lac, rațele din apropiere se sperie
}
// Bulă care urcă din adânc și dispare exact la suprafață.
function bubble(x,y){
  y=clamp(y,WATER_Y+4,H-2);
  parts.push({x:x+(Math.random()-0.5)*6,y,vx:(Math.random()-0.5)*0.3,vy:-0.7,g:0,life:Math.max(4,Math.floor((y-WATER_Y)/0.7)),max:0,col:theme.water.foam,s:1});
}
function steam(x){for(let i=0;i<7;i++)parts.push({x:x+(Math.random()-0.5)*8,y:WATER_Y-2,vx:(Math.random()-0.5)*0.6,vy:-0.5-Math.random()*0.7,g:-0.01,life:30,max:30,col:'#d8d8e0',s:2});}
// Un mob viu cade în apă: se scufundă; bomba se stinge (fără explozie).
function enterWater(e){
  e.sink=true;e.vy=Math.min(Math.max(e.vy,0.5),2.5);splash(e.x+e.w/2);
  // Apa frânează brusc mișcarea pe orizontală; și reținem pereții gropii, ca să nu treacă prin pământ.
  // Într-un lac înghețat, pereții sunt malurile lacului: sub gheață e tot apă.
  e.vx*=0.3;
  let l=Math.floor((e.x+e.w/2)/TS),r=l;const wet=c=>c==='.'||c==='I';
  while(wet(tileAt(l-1,12)))l--;while(wet(tileAt(r+1,12)))r++;
  e.pitL=l*TS;e.pitR=(r+1)*TS;
  if(e.type==='man'&&e.frozen&&e.slideDir)addScore(e.boy?100:200,e.x+5,WATER_Y-14);  // l-ai împins tu în apă, înghețat
  if(e.type==='bomb'){
    if(e.slideDir)addScore(100,e.x+6,WATER_Y-14);  // ai împins-o tu în apă
    if(e.lit){e.lit=0;steam(e.x+6);sfx.hiss();}
    e.slideDir=0;
  }
}
// Scufundare lentă: viteza tinde spre ~0,33 px/cadru, cu bule din când în când.
function sinkStep(e){
  e.vy=e.vy*0.88+0.04;e.y+=e.vy;e.vx*=0.85;
  // Rămâne între pereții gropii: dacă se lovește de unul, se oprește pe orizontală.
  // Marginea de 3px e pentru sprite, care e puțin mai lat decât hitbox-ul (picioarele să nu intre în pământ).
  const nx=clamp(e.x+e.vx,e.pitL+3,e.pitR-e.w-3);if(nx!==e.x+e.vx)e.vx=0;e.x=nx;
  if(G.t%10===0)bubble(e.x+e.w/2,e.y);
  if(e.y>H+20)e.remove=true;
}
// Desenată peste personaje (semi-transparentă), ca ce se scufundă să se vadă sub apă.
// La lacurile înghețate, apa e aceeași și sub gheață, și în copci: un singur lac, cu placa de gheață deasupra.
function drawWater(cx){
  const w=theme.water,x0=Math.max(0,Math.floor(cx/TS)),x1=Math.min(cols-1,Math.floor((cx+W)/TS));
  const wet=tx=>grid[12][tx]==='.'||grid[12][tx]==='I';
  const waveTop=wx=>WATER_Y+Math.round(Math.sin(wx*0.3+G.t*0.07)*1.2);
  for(let tx=x0;tx<=x1;tx++){
    if(!wet(tx))continue;
    let end=tx;while(end<x1&&wet(end+1))end++;
    for(let x=tx*TS-cx;x<(end+1)*TS-cx;x++){
      const iced=grid[12][Math.floor((x+cx)/TS)]==='I';
      // Valuri: suprafața urcă și coboară cu 1px, după poziția din lume (nu se „mută” la scroll).
      // Sub gheață apa stă (fără valuri) și începe de sub placă; adâncul e la aceeași înălțime peste tot.
      const top=iced?WATER_Y:waveTop(x+cx);
      // Sub gheață stratul de apă e mai subțire, ca să se vadă apa înghețată de dedesubt (drawLakeBase).
      ctx.globalAlpha=iced?0.35:0.82;
      if(iced){ctx.fillStyle=w.body;ctx.fillRect(x,12*TS+ICE_SLAB,1,WATER_Y+9-12*TS-ICE_SLAB);}
      else{ctx.fillStyle=w.body;ctx.fillRect(x,top+1,1,8);}
      ctx.fillStyle=w.deep;ctx.fillRect(x,top+9,1,H-top-9);
      ctx.globalAlpha=1;
      if(!iced){ctx.fillStyle=w.top;ctx.fillRect(x,top,1,1);}
    }
    // Sclipiri care clipesc pe apă (soare / apus / lună, după culoarea temei) — doar pe apa deschisă.
    ctx.fillStyle=w.glint;
    for(let wx=Math.ceil(tx*TS/12)*12;wx<(end+1)*TS-1;wx+=12){const k=wx/12;
      if(grid[12][Math.floor(wx/TS)]==='.'&&(((G.t>>3)+k*5)%7)<2)ctx.fillRect(wx-cx,WATER_Y+3+(k%3)*4,2,1);}
    if(theme.snow)drawIce(cx,tx,end,waveTop);
    // La fermă, gropile sunt iazuri: stuf pe margini și nuferi (după marginile reale ale gropii, nu ale ecranului).
    if(theme.farm){let s=tx;while(s>0&&grid[12][s-1]==='.')s--;let e2=end;while(e2<cols-1&&grid[12][e2+1]==='.')e2++;drawPond(cx,s,e2);}
    tx=end;
  }
}
// Fundul opac al lacurilor înghețate (sub gheață și în copci), desenat înaintea personajelor: fundalul nu se mai
// vede prin apă, iar ce cade în lac se vede în fața lui, sub stratul de apă din drawWater.
function drawLakeBase(cx){
  const x0=Math.max(0,Math.floor(cx/TS)),x1=Math.min(cols-1,Math.floor((cx+W)/TS));
  for(let tx=x0;tx<=x1;tx++){const c=grid[12][tx];if(c==='.'||c==='I')ctx.drawImage(pickVar(tiles.Lv,tx,13),tx*TS-cx,WATER_Y);}
}
// Placa de gheață a lacului (s..e = coloanele lacului de pe ecran), peste apă și peste ce cade în ea:
// crăpăturile, marginea zimțată spre apa deschisă și bucăți de gheață care plutesc pe valuri în copci și găuri.
const ICE_TEETH=[1,2,1,2,2,1,0];
function drawIce(cx,s,e,waveTop){
  for(let tx=s;tx<=e;tx++){const x=tx*TS-cx,y=12*TS;
    if(grid[12][tx]==='I'){
      ctx.drawImage(pickVar(tiles.Iv,tx,12),x,y);const st=iceStage(tx);if(st)ctx.drawImage(tiles.Icrack[st-1],x,y);
      const h=vhash(tx,5);
      for(let r=0;r<ICE_SLAB;r++){const len=ICE_TEETH[(r+h)%ICE_SLAB];if(!len)continue;ctx.fillStyle=ICE_ROWS[r];
        if(grid[12][tx+1]==='.')ctx.fillRect(x+TS,y+r,len,1);
        if(tx>0&&grid[12][tx-1]==='.')ctx.fillRect(x-len,y+r,len,1);}
    }else{
      const h=vhash(tx,9);if(h%3===0)continue;
      const bx=x+3+(h>>>4)%8,top=waveTop(bx+cx);
      ctx.fillStyle='#ffffff';ctx.fillRect(bx,top-1,4,1);ctx.fillStyle='#c4e6f6';ctx.fillRect(bx,top,4,1);ctx.fillStyle='#8cc4e2';ctx.fillRect(bx+1,top+1,2,1);
    }
  }
}
// Iazul fermei: nuferi care se leagănă pe valuri (unii cu floare roz) și stuf pe ambele margini, legănat de vânt.
function drawPond(cx,s,e){
  const L=s*TS,R=(e+1)*TS;
  for(let wx=L+10;wx<R-12;wx+=19){const h=vhash(wx,7);if(h%3===0)continue;
    const x=wx+(h>>>4)%6-cx,top=WATER_Y+Math.round(Math.sin(wx*0.3+G.t*0.07)*1.2);
    ctx.fillStyle='#2f7a2a';ctx.fillRect(x,top,7,2);ctx.fillRect(x+1,top-1,5,1);
    ctx.fillStyle='#5aa83a';ctx.fillRect(x+1,top-1,3,1);
    ctx.fillStyle=theme.water.body;ctx.fillRect(x+3,top,1,1);                    // crestătura frunzei
    if(h%5===1){ctx.fillStyle='#ff9ac0';ctx.fillRect(x+4,top-2,2,2);ctx.fillStyle='#ffffff';ctx.fillRect(x+4,top-2,1,1);}
  }
  for(const [ex,dir] of [[L,1],[R,-1]]){
    for(let i=0;i<4;i++){const x=ex+dir*(2+i*2)-cx-(dir<0?1:0),hgt=10+((i*7)%5)*2,sway=Math.round(Math.sin(G.t*0.03+i+ex)*1);
      ctx.fillStyle=i%2?'#3a8a2a':'#2a6a22';
      ctx.fillRect(x,WATER_Y-hgt/2,1,hgt/2+4);ctx.fillRect(x+sway,WATER_Y-hgt,1,hgt/2);
      if(i%2===0){ctx.fillStyle='#7a4a20';ctx.fillRect(x+sway,WATER_Y-hgt-1,2,4);}  // spicul de papură
    }
  }
}
// ================= VIAȚA LACULUI (nivelul 3, LACUL) =================
// Doar decor, fără efect asupra jocului:
// - rațe albe cu boboci galbeni care înoată încet de la un mal la altul (bobocii se țin după mamă); din când în când
//   rața se scufundă cu coada în sus; dacă pleoscăie ceva lângă ele sau trece curcanul jos, pe lângă ele, fug măcăind;
// - pești care sar din apă (cu cercuri și stropi), umbre de pești sub apă și cercuri care apar pe apă;
// - libelule care zboară deasupra apei;
// - broaște pe nuferi (aceiași nuferi ca în drawPond): orăcăie, iar când te apropii sar în apă și revin mai târziu.
const DUCK_PAL={k:'#4a4a5a',W:'#ffffff',g:'#cfd6e2',e:'#14121c',o:'#ff9a1a'};
const DUCK=spr(["........kkk...",".......kWWWk..",".......kWWeWoo",".......kWWWWoo","........kWWk..",
  "kk.....kWWWk..","kWkkkkkWWWWWk.","kWWWWWWWWWgWk.",".kWWWWWWWgggk.","..kkkkkkkkkk.."],DUCK_PAL);
const DUCK_DIVE=spr(["kk..........","kWk.........","kWWk........",".kWWkkk.....","..kWWWWkk...","...kWWWWWk..",
  "....kWWgWWk.",".....kkkkkk."],DUCK_PAL);
const DUCK_WING=spr(["..kk..",".kWWk.","kWWWWk"],DUCK_PAL);   // aripa ridicată, când fuge
const DUCKLING=spr(["....kk..","...kYYk.","...kYeYo","k..kYYk.","kYkYYYYk",".kYYYYk.","..kkkk.."],
  {k:'#7a6420',Y:'#ffe14a',e:'#14121c',o:'#ff9a1a'});
const FISH=spr(["...kkk..","k.kOOOek","kkOOOOOk","k..kkkk."],{k:'#7a2a0a',O:'#ff8a2a',e:'#14121c'});
const FROG=mkSprite([".kk...kk.","kwek.kwek","kGGGGGGGk","kGLLLLLGk","kGGkkkGGk","kk.....kk"],
  {k:'#1e4a1a',G:'#5ab83a',L:'#b8e070',w:'#ffffff',e:'#14121c'},false);
let lakeLife=null;
const lakeTop=wx=>WATER_Y+Math.round(Math.sin(wx*0.3+G.t*0.07)*1.2);   // suprafața apei, cu valuri (ca în drawWater)
const rnd=(a,b)=>a+Math.random()*(b-a);
const lakeSeen=x=>x>cam.x-16&&x<cam.x+W+16;
// În celelalte niveluri, apele de cel puțin POND_MIN tile-uri (iazuri, lacurile înghețate) au și ele umbre de pești,
// iar la fermă câte un locuitor: ziua o rață, noaptea o broască pe un nufăr. Iarna și în deșert nu sunt nuferi, deci
// doar umbrele (iarna, pe sub gheață). Peștii care sar, libelulele și cercurile întâmplătoare sunt doar pe LAC (full).
const POND_MIN=7;
function initLakeLife(){
  const full=!!theme.lake,wet=c=>c==='.'||c==='I';
  const L={full,spans:[],ducks:[],shadows:[],flies:[],fish:[],ripples:[],frogs:[],fishT:60,quackT:600,rippleT:40};
  for(let x=0;x<cols;x++){if(!wet(grid[12][x]))continue;let e=x;while(e+1<cols&&wet(grid[12][e+1]))e++;
    if(full||e-x+1>=POND_MIN)L.spans.push({a:x*TS,b:(e+1)*TS,n:e-x+1});x=e;}
  if(!L.spans.length)return null;
  const frogOn=(s,wx,px)=>L.frogs.push({s,wx,px,st:0,t:0,croak:0,croakT:rnd(60,300),x:0,y:0,vx:0,vy:0});
  for(const s of L.spans){
    for(let i=0;i<(full?Math.floor(s.n/8):Math.max(1,Math.floor(s.n/6)));i++)
      L.shadows.push({s,x:rnd(s.a+8,s.b-8),y:rnd(WATER_Y+9,H-6),dir:Math.random()<0.5?1:-1,sp:rnd(0.15,0.35)});
    if(full)for(let i=0;i<Math.floor(s.n/14);i++){const hx=rnd(s.a+16,s.b-16);L.flies.push({s,hx,hy:rnd(145,182),x:hx,y:170,ph:Math.random()*TAU,t:rnd(60,200),dir:1});}
    else if(theme.farm){
      if(theme.night){                                              // broasca, pe nufărul cel mai apropiat de mijloc
        let best=null;const mid=(s.a+s.b)/2;
        for(let wx=s.a+10;wx<s.b-12;wx+=19){const h=vhash(wx,7);if(h%3&&(!best||Math.abs(wx-mid)<Math.abs(best-mid)))best=wx;}
        if(best!==null)frogOn(s,best,best+(vhash(best,7)>>>4)%6);
      }else{const h=vhash(s.a,41);L.ducks.push({s,x:(s.a+s.b)/2,dir:h%2?1:-1,kid:[],dive:0,diveT:200+h%400,flee:0});}
    }
  }
  if(!full)return L;
  // 3 familii de rațe (mama și 2-3 boboci), câte una pe cele mai lungi trei ape — câte una în fiecare parte a nivelului.
  for(const s of [...L.spans].sort((a,b)=>b.n-a.n).slice(0,3)){
    const h=vhash(s.a,41),x=(s.a+s.b)/2,dir=h%2?1:-1,kid=[];
    for(let j=0;j<2+h%2;j++)kid.push({x:x-dir*(j+1)*11,dir});
    L.ducks.push({s,x,dir,kid,dive:0,diveT:200+h%400,flee:0});
  }
  // 4 broaște, pe nuferi aleși la distanțe cam egale de-a lungul lacului (nuferii sunt cei din drawPond).
  const pads=[];
  for(const s of L.spans)for(let wx=s.a+10;wx<s.b-12;wx+=19){const h=vhash(wx,7);if(h%3)pads.push({s,wx,px:wx+(h>>>4)%6});}
  for(let i=0;i<4&&pads.length;i++){const pd=pads[Math.floor((i+0.5)/4*pads.length)];frogOn(pd.s,pd.wx,pd.px);}
  return L;
}
function lakeRipple(x){lakeLife.ripples.push({x,t:0});if(lakeLife.ripples.length>24)lakeLife.ripples.shift();}
function lakeDrops(x,n){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-0.5)*4,y:WATER_Y-1,vx:(Math.random()-0.5)*1.2,vy:-0.8-Math.random()*1.2,g:0.15,life:18,max:18,col:theme.water.foam,s:1});}
// Ceva a pleoscăit în x (splash) sau trece curcanul pe lângă: rațele din apropiere fug (măcăie una singură).
function scareDucks(x){
  if(!lakeLife)return;let q=false;
  for(const d of lakeLife.ducks)if(Math.abs(d.x-x)<64&&d.flee<=0){d.flee=90;d.dive=0;d.dir=Math.sign(d.x-x)||1;if(lakeSeen(d.x))q=true;}
  if(q)sfx.quack();
}
function updateLakeLife(){
  const L=lakeLife,p=player,px=p?p.x+p.w/2:-9999,near=p&&!p.dead&&p.y+p.h>WATER_Y-40;
  for(const d of L.ducks){const s=d.s;
    if(near&&Math.abs(px-d.x)<30)scareDucks(px);
    if(d.dive>0)d.dive--;
    else{
      if(d.flee>0){d.flee--;if(G.t%3===0)parts.push({x:d.x-d.dir*7,y:WATER_Y-1,vx:-d.dir*0.4,vy:-0.6-Math.random()*0.6,g:0.12,life:14,max:14,col:theme.water.foam,s:1});}
      else if(--d.diveT<=0){d.dive=70;d.diveT=rnd(400,900);lakeRipple(d.x);}
      d.x+=d.dir*(d.flee>0?1.1:0.18);
      if(d.x<s.a+14){d.x=s.a+14;d.dir=1;}else if(d.x>s.b-14){d.x=s.b-14;d.dir=-1;}
    }
    // Bobocii: fiecare se ține la ~10 px de cel din fața lui (primul, de mamă); când mama se întoarce, trece pe lângă
    // ei și apoi o iau după ea.
    let lead=d;
    for(const k of d.kid){const dx=lead.x-k.x;
      if(Math.abs(dx)>10){k.x+=Math.sign(dx)*Math.min(d.flee>0?1.2:0.3,Math.abs(dx)-10);k.dir=Math.sign(dx);}
      k.x=clamp(k.x,s.a+8,s.b-8);lead=k;}
  }
  if(--L.quackT<=0){L.quackT=rnd(600,1300);if(L.ducks.some(d=>lakeSeen(d.x)))sfx.quack();}
  for(const s of L.shadows){s.x+=s.dir*s.sp;if(s.x<s.s.a+8||s.x>s.s.b-8||Math.random()<0.002)s.dir*=-1;}
  for(const f of L.flies){
    if(--f.t<=0){f.hx=clamp(f.hx+rnd(-70,70),f.s.a+16,f.s.b-16);f.hy=rnd(145,182);f.t=rnd(80,240);}
    const tx=f.hx+Math.sin(G.t*0.03+f.ph)*10,ty=f.hy+Math.sin(G.t*0.07+f.ph)*4,nx=f.x+(tx-f.x)*0.06;
    if(Math.abs(nx-f.x)>0.05)f.dir=Math.sign(nx-f.x);f.x=nx;f.y+=(ty-f.y)*0.06;
  }
  // Un pește sare din când în când, doar pe apa de pe ecran, destul de departe de mal ca să cadă tot în apă (doar pe LAC).
  if(L.full&&--L.fishT<=0){L.fishT=rnd(70,180);
    const vis=L.spans.filter(s=>s.n>=8&&s.b-56>cam.x&&s.a+56<cam.x+W);
    if(vis.length){const s=vis[Math.random()*vis.length|0],a=Math.max(s.a+56,cam.x+10),b=Math.min(s.b-56,cam.x+W-10);
      if(b>a){const x=rnd(a,b),dir=Math.random()<0.5?1:-1;L.fish.push({x,y:WATER_Y,vx:dir*rnd(0.5,0.9),vy:-rnd(2.8,3.6),dir});lakeRipple(x);lakeDrops(x,3);}}}
  for(const f of L.fish){f.vy+=0.14;f.x+=f.vx;f.y+=f.vy;
    if(f.vy>0&&f.y>WATER_Y){f.gone=true;lakeRipple(f.x);lakeDrops(f.x,4);if(lakeSeen(f.x))sfx.plip();}}
  L.fish=L.fish.filter(f=>!f.gone);
  if(L.full&&--L.rippleT<=0){L.rippleT=rnd(50,120);
    const vis=L.spans.filter(s=>s.b-12>cam.x&&s.a+12<cam.x+W);
    if(vis.length){const s=vis[Math.random()*vis.length|0];lakeRipple(rnd(Math.max(s.a+12,cam.x),Math.min(s.b-12,cam.x+W)));}}
  for(const r of L.ripples)r.t++;
  L.ripples=L.ripples.filter(r=>r.t<40);
  for(const f of L.frogs){const fx=f.px+4;
    if(f.st===0){                                                   // stă pe nufăr și orăcăie din când în când
      if(f.croak>0)f.croak--;
      else if(--f.croakT<=0){f.croak=36;f.croakT=rnd(180,420);if(lakeSeen(fx)&&Math.random()<0.4)sfx.croak();}
      if(p&&!p.dead&&Math.abs(px-fx)<44&&p.y+p.h>WATER_Y-90){      // te-ai apropiat: sare în apă (spre larg)
        let dir=px<fx?1:-1;if(fx-f.s.a<48)dir=1;else if(f.s.b-fx<48)dir=-1;
        f.st=1;f.x=f.px-1;f.y=lakeTop(f.wx)-7;f.vx=dir*rnd(0.8,1.2);f.vy=-2.4;}
    }else if(f.st===1){f.vy+=0.18;f.x+=f.vx;f.y+=f.vy;
      if(f.vy>0&&f.y+3>WATER_Y){f.st=2;f.t=rnd(360,600);lakeRipple(f.x+4);lakeDrops(f.x+4,5);if(lakeSeen(f.x))sfx.plip();}}
    else if(--f.t<=0&&Math.abs(px-fx)>90){f.st=0;lakeRipple(fx);}   // revine pe nufăr după câteva secunde
  }
}
// Se desenează după apă (drawWater): ce e pe suprafață stă „în” apă (rândurile de jos ale rațelor nu se văd).
function drawLakeLife(cx){
  const L=lakeLife,w=theme.water,on=x=>x>cx-24&&x<cx+W+24;
  ctx.fillStyle='rgba(14,34,84,0.3)';                               // umbrele peștilor, sub apă
  for(const s of L.shadows)if(on(s.x)){const x=Math.round(s.x-cx),y=Math.round(s.y);ctx.fillRect(x-3,y,7,2);ctx.fillRect(s.dir>0?x-5:x+4,y,2,1);}
  for(const r of L.ripples)if(on(r.x)){                              // cercurile de pe apă: două liniuțe care se depărtează
    const k=r.t/40,rad=Math.round(2+k*9),x=Math.round(r.x-cx),y=WATER_Y+1;
    ctx.globalAlpha=1-k;ctx.fillStyle=w.foam;ctx.fillRect(x-rad-2,y,3,1);ctx.fillRect(x+rad,y,3,1);if(r.t<10)ctx.fillRect(x-1,y-1,2,1);ctx.globalAlpha=1;}
  for(const f of L.frogs){
    if(f.st===0&&on(f.px)){const x=Math.round(f.px-cx)-1,y=lakeTop(f.wx)-7;ctx.drawImage(FROG,x,y);
      if(f.croak>0&&(f.croak>>3)%2===0)pcirc(ctx,x+4,y+4,2,'#e8f8c0');}       // gușa umflată, când orăcăie
    else if(f.st===1&&on(f.x))ctx.drawImage(FROG,Math.round(f.x-cx),Math.round(f.y));
  }
  // Rațele și bobocii: rândurile de jos sunt în apă (nu se desenează), cu o dungă luminoasă pe apă, lângă ei.
  const swim=(img,x,crop)=>{const top=lakeTop(x+cx),ih=img.height-crop;
    ctx.drawImage(img,0,0,img.width,ih,x,top-ih,img.width,ih);
    ctx.fillStyle=w.top;ctx.fillRect(x+1,top,img.width-2,1);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(x+2,top+1,img.width-4,1);};
  for(const d of L.ducks){
    for(const k of d.kid)if(on(k.x))swim(DUCKLING[k.dir>0?'r':'l'],Math.round(k.x-cx)-4,1);
    if(!on(d.x))continue;
    if(d.dive>0){swim(DUCK_DIVE[d.dir>0?'r':'l'],Math.round(d.x-cx)-6,1);continue;}
    const x=Math.round(d.x-cx)-7;swim(DUCK[d.dir>0?'r':'l'],x,2);
    if(d.flee>0&&(G.t>>2)%2)ctx.drawImage(DUCK_WING[d.dir>0?'r':'l'],d.dir>0?x+1:x+7,lakeTop(x+cx)-5);   // bate din aripi
  }
  for(const f of L.fish)if(on(f.x))ctx.drawImage(FISH[f.dir>0?'r':'l'],Math.round(f.x-cx)-4,Math.round(f.y)-2);
  for(const f of L.flies){if(!on(f.x))continue;                      // libelula: corp albastru, cap închis, aripi care vibrează
    const x=Math.round(f.x-cx),y=Math.round(f.y);
    ctx.fillStyle='#3a9ae8';ctx.fillRect(x-3,y,7,1);
    ctx.fillStyle='#1a3a8a';ctx.fillRect(f.dir>0?x+2:x-3,y-1,2,2);
    ctx.globalAlpha=0.75;ctx.fillStyle='#eaf6ff';const wy=(G.t>>1)%2?y-2:y-1;ctx.fillRect(x-3,wy,3,1);ctx.fillRect(x,wy,3,1);ctx.globalAlpha=1;
  }
}
// Decor discret pe sol, în fața jocului: smocuri de iarbă, flori și câte o tufă mică (cam o treime din tile-uri).
// ok(tx) spune pe ce coloane se poate pune (în joc: doar pe sol, nu lângă gropi).
function drawGroundDecor(cx,th,ok){
  const x0=Math.floor(cx/TS)-1,x1=Math.floor((cx+W)/TS)+1,y=192;
  for(let tx=x0;tx<=x1;tx++){
    if(!ok(tx))continue;
    const h=vhash(tx,99),k=h%16,bx=tx*TS-cx+((h>>>5)%10)+2;
    if(k<3){                                                                       // smoc de iarbă
      ctx.fillStyle=th.grassD;ctx.fillRect(bx,y-3,1,3);ctx.fillRect(bx+2,y-4,1,4);ctx.fillRect(bx+4,y-2,1,2);
      ctx.fillStyle=th.grassL;ctx.fillRect(bx+1,y-2,1,2);ctx.fillRect(bx+3,y-3,1,3);
    }else if(k<5){                                                                 // floare
      ctx.fillStyle=th.grassD;ctx.fillRect(bx+1,y-4,1,4);ctx.fillRect(bx,y-2,1,1);
      ctx.fillStyle=['#ffffff','#ffe14a','#ff8ac0','#ff5a5a'][(h>>>9)%4];ctx.fillRect(bx,y-6,3,1);ctx.fillRect(bx+1,y-7,1,3);
      ctx.fillStyle='#ffd23f';ctx.fillRect(bx+1,y-6,1,1);
    }else if(k===5){                                                               // tufă mică
      pcirc(ctx,bx+4,y-1,4,th.grassD);pcirc(ctx,bx+4,y-2,3,th.grass);ctx.fillStyle=th.grassL;ctx.fillRect(bx+2,y-4,2,1);
    }
  }
}
function sparkle(x,y){for(let i=0;i<6;i++){const a=i/6*TAU;parts.push({x,y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,g:0,life:16,max:16,col:i%2?'#fff':'#ffd23f',s:2});}}
function addCoin(x,y){
  G.coins++;addScore(100);sfx.coin();
  if(G.coins>=50){G.coins-=50;G.lives++;sfx.oneup();popup('1 VIAȚĂ!',x,y-10,'#7fff7f');}
}
function hitBlock(tx,ty){
  const c=tileAt(tx,ty);
  if(c==='M'||c==='H'||c==='A'){
    grid[ty][tx]='U';bumps.push({tx,ty,t:0});
    if(c==='M'){parts.push({type:'coin',x:tx*TS+8,y:ty*TS-6,vx:0,vy:-5.5,g:0.35,life:26,max:26});addCoin(tx*TS+8,ty*TS);}
    // Blocul de gheață (doar înaintea boss-ului): mereu afina înghețată; mic, te face direct mare și de gheață.
    else if(c==='A'){items.push({type:'ice',x:tx*TS+3,y:ty*TS,w:10,h:11,vx:0,vy:0,rise:11,dir:1});sfx.sprout();}
    // Curcan mic → grăunte auriu; curcan deja mare → boabă roșie de foc (iarna: afină înghețată).
    else{items.push({type:player.big?(theme.snow?'ice':'berry'):'grain',x:tx*TS+3,y:ty*TS,w:10,h:11,vx:0,vy:0,rise:11,dir:player.x<tx*TS?1:-1});sfx.sprout();}
  }else if(c==='B'){if(player.big)breakBrick(tx,ty);else{bumps.push({tx,ty,t:0});sfx.bump();}}
  else if(c==='S')slotHit();                      // blocul-slot din cafenea (vezi CAFENEAUA)
  else if(c==='E'){sfx.bump();cafeBonk();}        // blocul-slot gol: bătrânelul se supără dacă tot dai în el
  else sfx.bump();
  for(const e of enemies){if(e.dead||e.remove||!e.active)continue;
    if(overlap(e,{x:tx*TS,y:ty*TS-4,w:TS,h:5})){if(e.frozen)shatter(e,200);else if(e.type==='man')killMan(e,2,200);else lightBomb(e);}}
}
function breakBrick(tx,ty){
  grid[ty][tx]='.';sfx.brk();addScore(50);
  [[-1,-4],[1,-4],[-1,-2.5],[1,-2.5]].forEach(([vx,vy],i)=>parts.push({x:tx*TS+4+(i%2)*8,y:ty*TS+4+(i>>1)*8,vx:vx*1.3,vy,g:0.3,life:50,max:50,col:'#c98a4b',s:4,edge:'#6a3a1a'}));
}
// pts = punctele fermierului cu furcă (200 sărit în cap); ucenicul dă jumătate (100).
function killMan(e,mode,pts){
  e.dead=mode;e.deadT=mode===1?30:120;e.frozen=0;
  if(mode===2){e.vy=-4.5;e.vx=(Math.random()<0.5?-1:1)*1.2;}
  addScore(e.boy?pts/2:pts,e.x+5,e.y-4);
}
function lightBomb(e){if(e.type!=='bomb'||e.frozen)return;if(!e.lit){e.lit=96;sfx.fuse();}}
// Bomba lovită de un dușman înghețat: e aruncată de pe ecran ca fermierii (întoarsă, cu fitilul stins, fără explozie).
function knockBomb(e){
  e.dead=2;e.deadT=120;e.lit=0;e.sit=false;e.slideDir=0;e.vy=-4.5;e.vx=(Math.random()<0.5?-1:1)*1.2;
  addScore(100,e.x+6,e.y-4);
}
// ================= ÎNGHEȚAT (pana de gheață) =================
// Un dușman lovit de o pană de gheață rămâne prins într-un bloc de gheață ~5 s: nu se mișcă, nu rănește și poate fi
// împins (alunecă la fel ca bomba). Dacă gheața se sparge — îi sari în cap sau îl împingi în ceva (perete, alt mob) —
// moare; dacă îl împingi într-un alt mob (înghețat sau nu), mor amândoi. Dacă nu-l spargi, se dezgheață și își revine.
// Bomba înghețată are fitilul stins: spartă, dispare fără explozie; dezghețată, redevine bombă normală.
function freeze(e){
  const again=e.frozen>0;e.frozen=FREEZE_T;
  if(again)return;  // deja înghețat: doar reîncepe timpul
  e.vx=0;e.slideDir=0;e.slideT=0;e.kickT=0;
  if(e.type==='man'){e.atk=0;e.alert=0;e.chasing=false;e.puzzled=0;e.lost=0;}
  else{e.lit=0;e.sit=false;}
  for(let i=0;i<8;i++)parts.push({x:e.x+Math.random()*e.w,y:e.y+Math.random()*e.h,vx:(Math.random()-0.5)*0.6,vy:-0.3-Math.random()*0.5,g:0,life:18,max:18,col:i%2?'#ffffff':'#bfe8ff',s:1});
  sfx.freezeHit();
}
function iceShards(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=1+Math.random()*2;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,g:0.2,life:28,max:28,col:i%3?'#c8eeff':'#ffffff',s:2,edge:'#5aa8d8'});}}
// Gheața se sparge cu el cu tot: moare (bomba dispare, fără explozie).
function shatter(e,pts){
  iceShards(e.x+e.w/2,e.y+e.h/2,12);sfx.shatter();
  e.frozen=0;e.slideDir=0;
  if(e.type==='man')killMan(e,2,pts);else{e.remove=true;addScore(pts,e.x+6,e.y-4);}
}
// Se dezgheață singur: își revine (fermierul nu atacă chiar în aceeași clipă).
function thaw(e){
  e.frozen=0;e.slideDir=0;e.vx=0;iceShards(e.x+e.w/2,e.y+e.h/2,6);sfx.crack();
  if(e.type==='man'){e.atk=0;e.cd=40;}
}
function updateFrozen(e){
  if(e.kickT>0)e.kickT--;
  if(--e.frozen<=0){thaw(e);return;}
  if(e.slideDir){
    e.slideT+=onIce(e)?0.5:1;  // pe gheața lacului alunecă de două ori mai mult
    if(e.slideT>=BOMB_SLIDE_T){e.slideDir=0;e.vx=0;}
    else{e.vx=e.slideDir*bombSlideSpeed(e.slideT);if(e.onGround&&G.t%3===0&&Math.abs(e.vx)>0.8)parts.push({x:e.x+e.w/2,y:e.y+e.h,vx:-e.vx*0.2,vy:-0.4,g:0.03,life:12,max:12,col:'#dff4ff',s:1});}
  }else e.vx=0;
  e.vy=Math.min(e.vy+0.4,7);
  moveX(e);
  if(e.hitWall&&e.slideDir){shatter(e,200);return;}   // izbit de un perete (sau de țepi)
  moveY(e);
  if(e.y+e.h>WATER_Y&&overPit(e)){enterWater(e);return;}
  // Împins în boss: se sparge de el (boss-ul e prea greu ca să pățească ceva).
  if(e.slideDir&&Math.abs(e.vx)>0.3&&bossFighting()&&overlap(e,boss)){shatter(e,200);return;}
  if(e.slideDir&&Math.abs(e.vx)>0.3)for(const o of enemies){
    if(o===e||!o.active||o.dead||o.remove||o.sink||!overlap(e,o))continue;
    // Mor amândoi: alt înghețat se sparge și el; un fermier, un ucenic sau o bombă e aruncat de pe ecran (bomba,
    // întoarsă cu fundul în sus și stinsă, fără să explodeze).
    if(o.frozen)shatter(o,200);
    else{if(o.type==='man')killMan(o,2,200);else knockBomb(o);sfx.stomp();}
    shatter(e,200);return;
  }
  if(e.y>H+20)e.remove=true;
}
// Lovită (sărită în cap sau de o pană), bomba se așază în fund pe loc și se aprinde.
// Prima dată primește fitil nou, ca să ai timp s-o împingi; apelată din nou (bomba alunecă), doar o oprește.
function sitBomb(e){
  if(!e.sit){addScore(100,e.x+6,e.y-4);e.lit=BOMB_SIT_FUSE;sfx.fuse();}
  e.sit=true;e.slideDir=0;e.vx=0;
}
// Bomba care stă în fund e solidă din lateral: curcanul se oprește lângă ea (nu intră în ea) și o împinge.
function pushBomb(e,box){
  const p=player,d=Math.sign((e.x+e.w/2)-(p.x+p.w/2))||p.face;
  // Scoate curcanul din bombă ca dintr-un perete (moveX ține cont de pereții din spatele lui).
  const pen=d>0?(p.x+p.w)-box.x:(box.x+box.w)-p.x;
  if(pen>0){const vx=p.vx;p.vx=-d*pen;moveX(p);p.vx=vx;}
  if(!e.kickT)kickBomb(e,d);
}
// Pornește bomba din nou cu viteză maximă — și când e oprită, și când o ajungi din urmă sau vine spre tine.
function kickBomb(e,d){
  e.slideDir=d;e.slideT=0;e.dir=d;e.kickT=12;sfx.kick();dust(e.x+6,e.y+e.h,2);
}
function explode(e){
  const cx=e.x+6,cy=e.y+6,R=38;booms.push({x:cx,y:cy,t:0});sfx.boom();G.shake=14;
  for(let i=0;i<22;i++){const a=Math.random()*TAU,s=1+Math.random()*2.5;parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,g:0.08,life:30+Math.random()*20|0,max:50,col:['#fff3a0','#ffb02a','#ff5a1a','#6a5a62'][i%4],s:3});}
  if(!player.dead){const dx=player.x+player.w/2-cx,dy=player.y+player.h/2-cy;if(dx*dx+dy*dy<R*R)hurt(Math.sign(dx)||1);}
  for(const o of enemies){if(o===e||o.dead||o.remove||o.sink)continue;const dx=o.x+o.w/2-cx,dy=o.y+o.h/2-cy;
    if(dx*dx+dy*dy<R*R){if(o.frozen)shatter(o,300);else if(o.type==='man')killMan(o,2,300);else o.lit=o.lit?Math.min(o.lit,12):12;}}
  // Boss-ul e mare: îl prinde explozia dacă e cât de cât aproape (o lovitură).
  // Orice explozie îl rănește dacă e lângă el (de aceea nu-și aruncă niciodată bombele aproape de el).
  if(bossFighting()){const dx=boss.x+boss.w/2-cx,dy=boss.y+boss.h/2-cy;if(dx*dx+dy*dy<(R+14)*(R+14))bossHit(Math.sign(dx)||1);}
  const t0=Math.floor((cy-R)/TS),t1=Math.floor((cy+R)/TS),l0=Math.floor((cx-R)/TS),l1=Math.floor((cx+R)/TS);
  for(let ty=t0;ty<=t1;ty++)for(let tx=l0;tx<=l1;tx++){if(tileAt(tx,ty)!=='B')continue;const dx=tx*TS+8-cx,dy=ty*TS+8-cy;if(dx*dx+dy*dy<R*R)breakBrick(tx,ty);}
  // Explozia sparge și gheața lacurilor pe care o atinge (gaura îngheață la loc după câteva secunde, ca de obicei).
  let ice=false;
  for(let tx=l0;tx<=l1;tx++){if(tileAt(tx,12)!=='I')continue;const dx=tx*TS+8-cx,dy=12*TS+3-cy;if(dx*dx+dy*dy<R*R){breakIce(tx,true);ice=true;}}
  if(ice)sfx.iceBreak();
}
function hurt(dir=0){
  if(player.inv>0||player.dead||G.state!=='play'||G.god)return;
  if(!player.big){die();return;}
  // Curcanul de foc (sau de gheață) pierde întâi costumul (rămâne mare); abia apoi se micșorează.
  if(player.fire){player.fire=false;G.morph='fire';}else if(player.ice){player.ice=false;G.morph='ice';}else{setBig(false);G.morph='size';}
  G.growT=48;player.inv=120;sfx.shrink();G.shake=6;
}
// Schimbă mărimea curcanului păstrând picioarele pe loc.
function setBig(b){
  const p=player,ow=p.w,oh=p.h;p.big=b;p.w=b?12:10;p.h=b?20:13;

function powerUp(x,y){

function powerFire(x,y){

function throwFeather(){
  const p=player,d=p.face;
  // Mai rapidă decât curcanul; dacă fuge în aceeași direcție, pana primește puțin din viteza lui.
  const sp=6+Math.max(0,p.vx*d)*0.5;
  feathers.push({x:d>0?p.x+p.w-2:p.x-8,y:p.y+10,w:10,h:4,vx:d*sp,dir:d,dist:0,t:0,ice:!!p.ice});
  if(p.ice){sfx.fwipIce();frostBreath(6);}else sfx.fwip();   // cu un puf de abur mai mare la aruncare
}
function puffFeather(f){
  f.remove=true;
  for(let i=0;i<6;i++)parts.push({x:f.x+5,y:f.y+2,vx:(Math.random()-0.5)*1.4,vy:-Math.random()*1.2,g:-0.01,life:16,max:16,col:f.ice?(i%2?'#ffffff':'#9fdcff'):(i%2?'#8a8494':'#ff9a2a'),s:2});
}
function updateFeathers(){
  for(const f of feathers){
    f.x+=f.vx;f.dist+=Math.abs(f.vx);f.t++;
    // Dâră de flăcări (sau de chiciură, la pana de gheață) în urma penei.
    if(f.t%2===0)parts.push({x:f.x+(f.dir>0?0:9),y:f.y-2+Math.random()*3,vx:-f.dir*0.4,vy:f.ice?0.2:-0.4-Math.random()*0.5,g:-0.01,life:10,max:10,
      col:f.ice?(Math.random()<0.5?'#ffffff':'#bfe8ff'):(Math.random()<0.5?'#ffb02a':'#ffe040'),s:f.ice?1:2});
    // Zboară doar o anumită distanță; se stinge și dacă lovește un perete.
    const tx=Math.floor((f.dir>0?f.x+f.w:f.x)/TS),ty=Math.floor((f.y+f.h/2)/TS);
    if(solid(tileAt(tx,ty))||f.dist>=FEATHER_RANGE){puffFeather(f);continue;}
    // În cafenea, pana se stinge la pereți (dincolo e întuneric).
    if(inCafe()&&(f.x<cafe.a*TS+CAFE_L||f.x+f.w>cafe.a*TS+CAFE_R)){puffFeather(f);continue;}
    // Boss-ul: pana de gheață îl brumează (după 10 se face cub de gheață); cea de foc doar se stinge pe el.
    if(bossFighting()&&overlap(f,boss)){if(f.ice)bossIceHit();puffFeather(f);continue;}
    for(const e of enemies){
      if(!e.active||e.dead||e.remove||e.sink||offstage(e)||!overlap(f,e))continue;
      if(f.ice)freeze(e);                       // pana de gheață îngheață (fermieri, ucenici, bombe)
      else if(e.frozen)shatter(e,200);          // pana de foc topește gheața cu el cu tot
      else if(e.type==='man'){killMan(e,2,200);sfx.burn();}
      else if(!e.sit)sitBomb(e);
      puffFeather(f);break;
    }
  }
  feathers=feathers.filter(f=>!f.remove);
}
function die(){
  if(player.dead)return;player.dead=true;G.carryBig=false;G.carryFire=false;G.carryIce=false;feathers=[];G.state='dying';G.stateT=0;
  stopSong();playSong('death');player.vx=0;player.vy=0;
}
// Curcanul cade în apă (încă nu poate înota): pleoscăie, apoi se scufundă încet și pierde viața.
function drown(){
  if(player.dead)return;
  const vy=player.vy;splash(player.x+player.w/2);die();
  player.drown=true;player.vy=Math.min(Math.max(vy,0.5),2.5);

function levelClear(final){G.carryBig=player.big;G.carryFire=player.fire;G.carryIce=player.ice;feathers=[];G.state='clear';G.final=final;G.stateT=0;G.tally=0;G.clearTime=G.time;stopSong();playSong('clear');player.vx=0;}

// ================= UPDATE =================
function updatePlayer(){
  const p=player,L=inLeft(),R=inRight(),run=inRun(),jh=inJump();
  // Mers cu viteză constantă; accelerează la fugă doar cât timp e ținut X.
  // Pe sol: viteză CONSTANTĂ — doar săgeți = mers (2); săgeți + X = rapid (3.4).
  // Ajunge la viteza țintă în 2-3 cadre, fără accelerare lentă.
  // În aer: păstrează viteza din momentul săriturii.
  const WALK=2,RUN=3.4;
  if(p.inv>0)p.inv--;
  const dir=(R&&!L)?1:(L&&!R)?-1:0;
  if(dir)p.face=dir;
  if((p.fire||p.ice)&&firePressed()&&feathers.length<FEATHER_MAX)throwFeather();
  // Curcanul de gheață sclipește rece din când în când.
  if(p.ice&&G.t%12===0)parts.push({x:p.x+Math.random()*p.w,y:p.y+4+Math.random()*(p.h-6),vx:0,vy:-0.2,g:0,life:16,max:16,col:'#ffffff',s:1});
  if(p.onGround){
    const target=dir*(run?RUN:WALK);
    // Pe gheață aluneci: pornești ceva mai greu, iar când te oprești sau întorci, mai aluneci puțin.
    let acc=0.6;
    if(p.onIce)acc=(target!==0&&target*p.vx>=0&&Math.abs(target)>Math.abs(p.vx))?ICE_ACC:ICE_FRICTION;
    if(dir&&p.vx*dir<0&&G.t%4===0)dust(p.x+p.w/2,p.y+p.h,1);
    if(p.onIce&&Math.abs(p.vx)>0.8&&(!dir||dir*p.vx<0)&&G.t%3===0)
      parts.push({x:p.x+p.w/2+(Math.random()-0.5)*6,y:p.y+p.h-1,vx:p.vx*0.3,vy:-0.4-Math.random()*0.4,g:0.04,life:14,max:14,col:Math.random()<0.5?'#ffffff':'#cdeeff',s:1});
    if(p.vx<target)p.vx=Math.min(target,p.vx+acc);else if(p.vx>target)p.vx=Math.max(target,p.vx-acc);
    p.airMax=Math.max(WALK,Math.abs(p.vx));
  }else{
    const max=p.airMax||WALK;
    if(dir)p.vx+=dir*0.15;
    p.vx=clamp(p.vx,-max,max);
  }
  if(jumpPressed())p.jbuf=8;else if(p.jbuf>0)p.jbuf--;
  if(p.onGround){p.coyote=6;p.combo=0;}else if(p.coyote>0)p.coyote--;
  if(p.jbuf>0&&p.coyote>0){p.vy=-6.2-Math.abs(p.vx)*0.12;p.jbuf=0;p.coyote=0;p.onGround=false;sfx.jump();}
  p.vy=Math.min(p.vy+((jh&&p.vy<0)?0.27:0.42),7);
  if(!jh&&p.vy<-3.5)p.vy=-3.5;
  const wasAir=!p.onGround,vyB=p.vy;
  moveX(p);moveY(p);
  if(p.headHit)hitBlock(p.headHit[0],p.headHit[1]);
  if(p.onGround&&wasAir&&vyB>3)dust(p.x+p.w/2,p.y+p.h,4);
  // Curcanul de foc: jar din coadă și de pe costum (mai des când fuge), scântei din picioare la aterizare.
  if(p.fire&&p.big){const sp=Math.abs(p.vx),rate=sp>2.5?4:sp>0.5?8:14;if(G.t%rate===0)ember();if(p.onGround&&wasAir&&vyB>2)landSparks();}
  if(p.onGround&&Math.abs(p.vx)>0.1)p.anim+=Math.abs(p.vx)*0.22;
  // Cât timp a stat pe loc (pentru respirație); orice pas sau săritură o ia de la capăt.
  p.idle=p.onGround&&Math.abs(p.vx)<=0.1?(p.idle||0)+1:0;
  // Curcanul de gheață scoate abur din cioc: la fiecare expirație când stă pe loc, altfel cam o dată la 1,5 s.
  if(p.ice&&p.big&&((p.idle>IDLE_WAIT&&(p.idle-IDLE_WAIT)%BREATH_T===0)||(!p.idle&&G.t%90===0)))frostBreath(3);
  // Curcanul de foc, când stă pe loc: la fiecare expirație scoate pe cioc o flăcăruie care se face fum.
  if(p.fire&&p.big&&p.idle>IDLE_WAIT&&(p.idle-IDLE_WAIT)%BREATH_T===0)fireBreath();
  // Pe gheață: aluneci (vezi mai sus), iar gheața de sub picioare crapă dacă stai prea mult pe același loc.
  p.onIce=onIce(p);
  if(p.onGround){const under=iceUnder(p);if(under.length)stepOnIce(under);}
  // Țepii rănesc doar când calci pe ei de sus; dacă doar mergi în ei din lateral, te opresc ca un perete.
  if(p.onGround&&standsOnSpikes(p))hurt(-p.face);
  if(p.y+p.h>WATER_Y&&overPit(p))drown();
  else if(p.y>H+8)die();
}
function updateMan(e){
  if(e.dead){e.deadT--;
    if(e.dead===2){e.vy+=0.35;e.y+=e.vy;e.x+=e.vx;
      // Fermierul aruncat de pe ecran face pleosc doar dacă trece de nivelul apei chiar deasupra unei gropi cu apă.
      // (Se verifică o singură dată: dacă a căzut prin pământ, nu mai face pleosc când ajunge pe sub un lac vecin.)
      if(!e.wet&&e.y+e.h>WATER_Y){e.wet=true;if(overPit(e))splash(e.x+e.w/2);}}
    if(e.deadT<=0)e.remove=true;return;}
  if(e.sink){sinkStep(e);return;}
  if(e.frozen){updateFrozen(e);return;}
  const dx=(player.x+player.w/2)-(e.x+5),dy=(player.y+player.h)-(e.y+e.h);
  // Chemat de boss (vezi bossSummon): intră pe jos în poiană, de după una dintre stivele de fân. Când a trecut și
  // de felinar, se întoarce spre tine și se poartă ca orice mob.
  if(e.enter){
    const b=boss;
    if(!b||(e.enter>0?e.x>=b.a0+16:e.x+e.w<=b.a1-16)){e.enter=0;e.dir=Math.sign(dx)||e.dir;e.cd=30;}
    else{e.dir=e.enter;e.vx=0;e.x+=e.enter*(e.boy?0.6:0.9);e.anim+=e.boy?1:1.6;return;}
  }
  if(e.cd>0)e.cd--;
  if(e.boy){
    // Ucenicul nu te urmărește și nu atacă: se plimbă încet înainte și înapoi și se întoarce
    // la marginea gropilor, în fața țepilor și la pereți (hitWall, mai jos).
    e.vx=e.dir*BOY_SPEED;
    if(e.onGround&&(!groundAhead(e,e.dir)||spikeAhead(e,e.dir))){e.dir*=-1;e.vx=e.dir*BOY_SPEED;}
  }else if(e.atk){
    // Atac cu furca: trage furca înapoi (avertizare), apoi împunge și face un pas în față.
    // Direcția rămâne fixă — dacă sari peste el în timpul avertizării, împunge în gol.
    e.atk++;e.vx=0;
    const st=e.atk-MAN_WIND_T;
    if(st===1)sfx.stab();
    if(st>0&&st<=6&&e.onGround&&groundAhead(e,e.dir))e.vx=e.dir*1.4;
    if(st>0&&st<=10&&!player.dead&&overlap(player,forkBox(e)))hurt(e.dir);
    if(st>=MAN_STAB_T){e.atk=0;e.cd=50;}
  }else{
    // Ziua te vede de departe. Noaptea doar în conul de lumină al felinarului (din fața lui); dacă ieși din lumină,
    // mai aleargă puțin spre locul unde te-a văzut ultima dată, apoi se oprește nedumerit („?”) și se uită în jur.
    let see,tdx=dx;
    if(theme.night){
      if(!player.dead&&lanternSees(e)){see=true;e.lastX=player.x+player.w/2;e.lost=0;}
      else if(e.chasing){e.lost=(e.lost||0)+1;tdx=e.lastX-(e.x+5);see=e.lost<LOST_T&&Math.abs(tdx)>6;if(!see)e.puzzled=70;}
      else see=false;
    }else see=!player.dead&&Math.abs(dx)<140&&Math.abs(dy)<56;
    if(see&&!e.chasing){e.alert=28;e.puzzled=0;if(G.t-G.lastAlert>30){sfx.alert();G.lastAlert=G.t;}}
    e.chasing=see;
    if(e.puzzled>0){e.puzzled--;e.vx=0;if(e.puzzled===35)e.dir*=-1;}
    else if(e.alert>0){e.alert--;e.vx=0;if(Math.abs(dx)>2)e.dir=Math.sign(dx);}
    else if(e.chasing&&!(e.lost>0)&&!e.cd&&e.onGround&&Math.abs(dx)<30&&Math.abs(dy)<12){
      // Curcanul e foarte aproape și la aceeași înălțime: începe atacul.
      e.atk=1;e.vx=0;e.dir=Math.sign(dx)||e.dir;sfx.windup();
    }else{
      if(e.chasing&&Math.abs(tdx)>6)e.dir=Math.sign(tdx);
      const sp=e.chasing?0.8:0.35;e.vx=e.dir*sp;
      // La marginea unei gropi sau în fața țepilor: când te urmărește se oprește (nu sare), altfel se întoarce.
      if(e.onGround&&(!groundAhead(e,e.dir)||spikeAhead(e,e.dir))){if(e.chasing)e.vx=0;else{e.dir*=-1;e.vx=e.dir*sp;}}
    }
  }
  e.vy=Math.min(e.vy+0.4,7);
  const moving=e.vx!==0;
  moveX(e);if(e.hitWall&&!e.atk){if(e.chasing&&e.onGround)e.vy=-5.6;else if(!e.chasing)e.dir*=-1;}
  moveY(e);
  if(e.y+e.h>WATER_Y&&overPit(e)){enterWater(e);return;}
  // Ajuns totuși cu picioarele pe țepi (de exemplu căzând de sus): moare și zboară de pe ecran.
  if(e.onGround&&standsOnSpikes(e)){killMan(e,2,200);sfx.stomp();return;}
  if(moving)e.anim+=e.chasing?1.6:1;
  if(e.y>H+20)e.remove=true;
}
function updateBomb(e){
  // Aruncată de pe ecran (knockBomb): cade ca fermierii, cu pleosc doar dacă trece de nivelul apei deasupra unei gropi.
  if(e.dead){e.deadT--;e.vy+=0.35;e.y+=e.vy;e.x+=e.vx;
    if(!e.wet&&e.y+e.h>WATER_Y){e.wet=true;if(overPit(e))splash(e.x+e.w/2);}
    if(e.deadT<=0)e.remove=true;return;}
  if(e.sink){sinkStep(e);return;}
  if(e.frozen){updateFrozen(e);return;}
  if(e.kickT>0)e.kickT--;
  // Încruntată când curcanul e în fața ei, destul de aproape (aprinsă e oricum furioasă — vezi drawEnemy).
  const sdx=(player.x+player.w/2)-(e.x+6),sdy=(player.y+player.h)-(e.y+e.h);
  e.angry=!player.dead&&Math.sign(sdx)===e.dir&&Math.abs(sdx)<120&&Math.abs(sdy)<48;
  if(e.sit){
    // Stă în fund: nu mai fuge după curcan. Împinsă, alunecă (ricoșează din pereți, cade de pe margini)
    // și trece pe lângă mobi; explodează doar când i se termină fitilul, luând cu ea pe cei din jur.
    // Aruncată de boss: zboară în arc (păstrează viteza) până atinge solul, apoi stă în fund.
    if(e.thrown){if(e.onGround){e.thrown=false;e.vx=0;sfx.bump();}}
    else if(e.slideDir){
      e.slideT+=onIce(e)?0.5:1;  // pe gheață alunecă de două ori mai mult
      if(e.slideT>=BOMB_SLIDE_T){e.slideDir=0;e.vx=0;}
      else{e.vx=e.slideDir*bombSlideSpeed(e.slideT);if(e.onGround&&G.t%3===0&&Math.abs(e.vx)>0.8)dust(e.x+6,e.y+e.h,1);}
    }else e.vx=0;
  }else if(!e.lit){
    const dx=(player.x+player.w/2)-(e.x+6),dy=(player.y+player.h-6)-(e.y+6);
    if(!player.dead&&dx*dx+dy*dy<40*40)lightBomb(e);
    e.vx=e.dir*0.4;if(e.onGround&&!groundAhead(e,e.dir)){e.dir*=-1;e.vx=e.dir*0.4;}
  }else{
    const dx=(player.x+player.w/2)-(e.x+6);if(Math.abs(dx)>3)e.dir=Math.sign(dx);
    e.vx=e.dir*0.7;if(e.onGround&&!groundAhead(e,e.dir))e.vx=0;
  }
  if(e.lit){
    e.lit--;if(e.lit%(e.lit<36?5:10)===0)sfx.tick();
    if(e.lit<=0){explode(e);e.remove=true;return;}
  }
  e.vy=Math.min(e.vy+0.4,7);
  moveX(e);
  if(e.hitWall){if(e.slideDir){e.slideDir=-e.slideDir;e.dir*=-1;sfx.bump();}else if(!e.lit)e.dir*=-1;}
  moveY(e);if(!e.sit)e.anim++;
  if(e.y+e.h>WATER_Y&&overPit(e)){enterWater(e);return;}
  if(e.y>H+20)e.remove=true;
}
function updateFx(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}
  parts=parts.filter(p=>p.life>0);
  for(const p of popups){p.y-=0.5;p.t--;}popups=popups.filter(p=>p.t>0);
  for(const b of booms)b.t++;booms=booms.filter(b=>b.t<24);
  for(const b of bumps)b.t++;bumps=bumps.filter(b=>b.t<8);
  if(lakeLife)updateLakeLife();
  if(G.shake>0)G.shake--;
}
function updateCam(){
  // În lupta cu boss-ul, camera stă pe poiană (între cele două stive de baloți de fân).
  // În cafenea, camera stă pe cameră (un ecran); afară nu trece de capătul nivelului (camera cafenelei e după el).
  const target=boss&&boss.lock?boss.a0-TS:inCafe()?cafe.a*TS+CAFE_CAMX:clamp(player.x+player.w/2-W*0.42,0,camMax());
  cam.x+=(target-cam.x)*0.18;
}
function updatePlay(){
  // Animația de creștere/micșorare îngheață jocul pentru o clipă, ca la platformerele clasice.
  if(G.growT>0){G.growT--;return;}
  // Intrarea / ieșirea din cafenea: ecranul se întunecă, iar la jumătate curcanul trece dincolo de ușă.
  if(G.doorT>0){if(--G.doorT===DOOR_T/2)cafeTeleport();updateFx();return;}
  // Cât vorbește bătrânelul, jocul stă: doar caseta de dialog, fumul și blocul-slot merg mai departe.
  if(G.talk){updateTalk();if(cafe)updateCafe();updateFx();return;}
  G.frame++;
  if(!TEST&&!inCafe()&&G.frame%60===0){G.time--;   // în cafenea timpul stă pe loc
    if(G.time===100){sfx.hurry();popup('GRĂBEȘTE-TE!',player.x+5,player.y-12,'#ff6060');}
    if(G.time<=0){G.time=0;die();return;}}
  updatePlats();
  updatePlayer();
  if(G.state!=='play'){updateFx();return;}
  if(cafe){updateCafe();const d=cafeAction();
    if(d&&upPressed()){if(d==='talk')openTalk([cafeLine()]);else{G.doorT=DOOR_T;G.doorTo=d;player.vx=0;sfx.bell();}}}
  for(const e of enemies){
    if(e.remove)continue;
    if(!e.active){if(e.x<cam.x+W+24&&e.x>cam.x-80)e.active=true;else continue;}
    if(e.type==='man')updateMan(e);else updateBomb(e);
    if(G.state!=='play')break;
  }
  if(G.state==='play')for(const e of enemies){
    if(!e.active||e.dead||e.remove||e.sink||player.dead||offstage(e))continue;
    const box=e.sit?{x:e.x-BOMB_PUSH_PAD,y:e.y,w:e.w+BOMB_PUSH_PAD*2,h:e.h}:e;
    if(!overlap(player,box))continue;
    const stomp=player.vy>0&&(player.y+player.h-e.y)<=Math.max(8,player.vy+3);
    if(stomp){
      player.y=e.y-player.h;player.vy=inJump()?-6.6:-4.3;
      // Înghețat: săritura în cap sparge gheața cu el cu tot (moare).
      if(e.frozen){shatter(e,[200,400,800,1600,3200][Math.min(player.combo,4)]);player.combo++;}
      else if(e.type==='man'){killMan(e,1,[200,400,800,1600,3200][Math.min(player.combo,4)]);player.combo++;sfx.stomp();}
      else{
        // Bomba: prima săritură în cap o așază în fund; a doua (și ricoșeul de după prima, dacă aterizezi iar pe ea)
        // o lansează în direcția în care se uită curcanul; dacă alunecă, o săritură în cap o oprește.
        if(!e.sit||e.slideDir)sitBomb(e);else kickBomb(e,player.face);
        sfx.stomp();
      }
    }else if(e.frozen||(e.type==='bomb'&&e.sit))pushBomb(e,box);   // înghețații nu rănesc: se împing, ca bomba în fund
    else if(e.type==='man')hurt(Math.sign(player.x-e.x)||1);
  }
  enemies=enemies.filter(e=>!e.remove);
  if(boss){updateBoss();bossArenaBounds();enemies=enemies.filter(e=>!e.remove);}
  updateIce();
  updateFeathers();
  for(const c of coins){if(c.taken)continue;if(overlap(player,{x:c.x-5,y:c.y-6,w:10,h:12})){c.taken=true;addCoin(c.x,c.y);sparkle(c.x,c.y);}}
  for(const it of items){
    if(it.rise>0){it.y-=1;it.rise--;continue;}
    // Boaba roșie stă pe loc deasupra blocului; grăuntele auriu se plimbă.
    if(it.type==='berry'||it.type==='ice'){if(overlap(player,it)){it.remove=true;if(it.type==='ice')powerIce(it.x+5,it.y);else powerFire(it.x+5,it.y);}continue;}
    it.vx=it.dir*0.8;it.vy=Math.min(it.vy+0.35,6);moveX(it);if(it.hitWall)it.dir*=-1;moveY(it);
    if(it.y+it.h>WATER_Y&&overPit(it)){it.remove=true;splash(it.x+it.w/2);continue;}
    if(overlap(player,it)){it.remove=true;powerUp(it.x+5,it.y);}
  }
  items=items.filter(i=>!i.remove);
  // (În cafenea curcanul e în dreapta hărții, după punctele de salvare și după țintă: acolo nu se ating.)
  for(const cp of cps){if(cp.on){cp.raise=Math.min(1,cp.raise+0.05);continue;}
    if(!inCafe()&&player.x+player.w>cp.x+6){cp.on=true;G.cp={level:G.level,x:cp.tx};sfx.cp();popup('SALVAT!',cp.x+8,150,'#7fff7f');}}
  if(G.state==='play'&&goal&&!inCafe()){
    if(goal.type==='sign'&&player.x+player.w>goal.x*TS+34)levelClear(false);
    else if(goal.type==='restaurant'&&overlap(player,doorRect()))levelClear(true);
  }
  updateFx();updateCam();
}
function updateDying(){
  G.stateT++;

    player.vy=player.vy*0.88+0.04;player.y+=player.vy;

  }else{
    if(G.stateT===30)player.vy=-6.5;
    if(G.stateT>30){player.vy+=0.35;player.y+=player.vy;}
  }
  if(G.stateT>=160){if(TEST){startLevel();return;}G.lives--;

    else toIntro(false);}

  else{const d=doorRect(),tx=d.x+d.w/2-player.w/2;player.x+=Math.sign(tx-player.x)*Math.min(0.8,Math.abs(tx-player.x));player.anim+=0.2;

    else if(++G.tally>90){

}

function toggleFS(){try{
  const d=document,el=d.documentElement;
  const p=isFS()?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  if(p&&p.catch)p.catch(()=>{});
}catch(e){}}
function openMenu(m,sel=0){G.menu=m;G.sel=sel;}

const MENU={
  main:[
    {label:'JOACĂ',act:()=>newGame()},
    {label:'SETĂRI',sub:true,act:()=>openMenu('settings')},
    {label:'MOD TEST',act:()=>{location.href='test.html';}}],
  settings:[

    ...(FS_OK?[{label:'ECRAN COMPLET',val:isFS,act:toggleFS}]:[]),

}
// Unde stă fiecare buton, în pixeli de joc: meniul principal sub titlu; setările (mai late) sub „SETĂRI”, cu ÎNAPOI
// puțin mai jos, despărțit de restul; la controale, ÎNAPOI e sub lista de taste.
function menuRects(){
  const m=G.menu,items=MENU[m],h=15;
  const L=m==='main'?{w:96,gap:5,y0:102}:m==='settings'?{w:168,gap:4,y0:54}:{w:96,gap:0,y0:142};
  return items.map((it,i)=>({it,x:W/2-L.w/2,y:L.y0+i*(h+L.gap)+(m==='settings'&&i===items.length-1?6:0),w:L.w,h}));
}
function menuHit(e){
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  return menuRects().findIndex(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);
}
function menuPick(i){G.sel=i;MENU[G.menu][i].act();sfx.coin();}
function menuKey(code){
  const n=MENU[G.menu].length;
  if(code==='ArrowUp'||code==='ArrowDown'){G.sel=(G.sel+(code==='ArrowUp'?-1:1)+n)%n;sfx.blip();}
  else if(code==='Enter'||code==='Space')menuPick(G.sel);
  else if((code==='ArrowLeft'||code==='ArrowRight')&&MENU[G.menu][G.sel].val)menuPick(G.sel);
  else if(code==='Escape'||code==='Backspace')menuBack();
}

function update(){
  G.t++;
  if(pressed.KeyM)toggleMusic();
  if(TEST&&pressed.KeyR)TEST_CMDS.reset();
  switch(G.state){
    case 'title':cam.x+=0.6;if(AC&&!seq.song)playSong('title');break;
    // Ecranul de dinaintea nivelului stă până apeși ENTER / SPACE (sau atingi ecranul); primele ~0,7 s nu se poate
    // sări, ca să nu-l treci din greșeală dacă tocmai apăsai taste.
    case 'intro':G.stateT++;if(G.stateT>40&&startPressed())startLevel();break;
    case 'play':
      if(pressed.KeyP||pressed.Escape){G.paused=!G.paused;sfx.pause();applyAudio();}
      // G.stepOnce (doar din modul de test): pe pauză, jocul avansează un singur cadru.
      if(!G.paused||G.stepOnce){G.stepOnce=false;updatePlay();}break;
    case 'dying':updateDying();updateFx();break;
    case 'clear':updateClear();updateFx();break;
    case 'win':updateWin();break;
    case 'gameover':G.stateT++;if(G.stateT>90&&startPressed()){G.state='title';stopSong();playSong('title');}break;
  }
  for(const k in pressed)delete pressed[k];
  if(TOUCH_UI)TOUCH_UI.classList.toggle('door',G.state==='play'&&!!cafeAction());
  if(TEST&&G.t%6===0)testStatus();
}

function drawTiles(cx){

    if(c==='I'){

    if(!img)continue;let oy=0;for(const b of bumps)if(b.tx===tx&&b.ty===ty)oy=-BUMPY[b.t];

    if(theme.snow&&SNOW_CAPPED.includes(c)){const up=tileAt(tx,ty-1);if(!solid(up)&&up!=='=')ctx.drawImage(tiles.cap,tx*TS-cx,ty*TS+oy);}}}

function drawPlayer(cx){
  const p=player;
  // În timpul transformării alternează între mic și mare.
  // Costumul: roșu (foc) sau albastru deschis (gheață). La schimbarea costumului clipește între costum și fără.
  let showBig=p.big,suit=p.fire?'fire':p.ice?'ice':'';
  if(G.growT>0&&(G.growT>>2)%2){if(G.morph==='fire'||G.morph==='ice')suit=suit?'':G.morph;else showBig=!showBig;}
  const S=showBig?(suit==='fire'?TKF:suit==='ice'?TKI:TK):TKS,sw=showBig?20:16,sh=showBig?23:16;
  const dx=Math.round(p.x+p.w/2-sw/2-cx),dy=Math.round(p.y+p.h-sh);
  if(p.dead){ctx.drawImage(p.drown?S.J[p.face>0?'r':'l']:S.DEAD,dx,dy);return;}
  if(p.inv>0&&G.growT<=0&&(p.inv>>2)%2)return;
  let f='A';if(!p.onGround&&G.state!=='clear')f='J';else if(Math.abs(p.vx)>0.1||(G.state==='clear'))f=TK_RUN[Math.floor(p.anim)%4];
  else if(p.idle>IDLE_WAIT&&(p.idle-IDLE_WAIT)%BREATH_T<BREATH_OUT)f='I';
  const img=S[f][p.face>0?'r':'l'];
  if(p.alpha<1)ctx.globalAlpha=p.alpha;
  ctx.drawImage(img,dx,dy+sh-img.height);  // cadrul de respirație e mai scund: tălpile rămân pe sol
  // Costumul de gheață: sclipirea care trece peste costum și capetele fularului (de la ceafă, din spate).
  if(showBig&&suit==='ice'){const oy=dy+sh-img.height;drawIceSheen(dx,oy,p.face);drawScarf(dx+(p.face>0?6:13),oy+11,p);}  ctx.globalAlpha=1;
}
// O dungă de lumină care trece pe diagonală peste costumul de gheață, cam o dată la 2,5 secunde.
function drawIceSheen(x0,y0,face){
  const t=G.t%150;if(t>=24)return;
  const pos=t*1.3-6,a=ctx.globalAlpha;ctx.globalAlpha=a*0.6;ctx.fillStyle='#ffffff';
  for(const [x,y] of TKI_SHEEN)if(Math.abs((x-4)+(y-12)*0.7-pos)<1)ctx.fillRect(x0+(face>0?x:19-x),y0+y,1,1);
  ctx.globalAlpha=a;
}
// Capetele fularului: două fâșii cu dungi albastre și albe. Când stă, atârnă pe spate; când fuge, flutură
// orizontal în urma lui (cu valuri mai mari cu cât fuge mai repede); în aer rămân puțin în urmă pe verticală.
function drawScarf(ax,ay,p){
  const face=p.face,run=Math.min(1,Math.abs(p.vx)/3),air=!p.onGround;
  for(const [len,oy,ph] of [[7,0,0],[5,1,1.3]])for(let i=0;i<len;i++){
    const k=i+1;
    const sx=-face*(0.3+run*0.9+(air?0.3:0))*k,sy=(1-run)*k*0.9+run*k*0.15+(air?-p.vy*0.08*k:0);
    const wave=Math.sin(G.t*(0.25+run*0.2)-i*0.8+ph)*(0.3+run*1.2)*(i/len);
    ctx.fillStyle=i===len-1?'#2a5aa8':((i>>1)%2)?'#ffffff':'#3a7ad8';
    ctx.fillRect(Math.round(ax+sx),Math.round(ay+oy+sy+wave),2,2);
  }
}
// Jar care se ridică din coada și de pe costumul curcanului de foc și se stinge în aer.

// Vârful ciocului (curcan mare), în lume: x, y. La expirație (cadrul de respirație) capul e cu 1 px mai jos.
function beakTip(){
  const p=player,f=p.face,down=p.idle>IDLE_WAIT&&(p.idle-IDLE_WAIT)%BREATH_T<BREATH_OUT?1:0;
  return [p.x+p.w/2-10+(f>0?19:0),p.y+p.h-23+7+down];
}
// Curcanul de foc, la expirație când stă pe loc: o flăcăruie mică iese din cioc și se face fum care se ridică.
function fireBreath(){
  const f=player.face,[bx,by]=beakTip();
  for(let i=0;i<4;i++)parts.push({x:bx+f*i*0.8,y:by-0.5+Math.random(),vx:f*(0.5+Math.random()*0.4),vy:-0.15-Math.random()*0.2,g:-0.01,
    life:8+(Math.random()*6|0),max:14,col:EMBER_COLS[i%3],s:1});

// Abur rece din cioc (curcanul de gheață): un nor mic, alb, care iese în față și se risipește.
function frostBreath(n){
  const p=player,f=p.face,[bx,by]=beakTip();
  for(let i=0;i<n;i++)parts.push({x:bx+f*Math.random()*2,y:by-1+Math.random()*2,vx:f*(0.3+Math.random()*0.4),vy:-0.1-Math.random()*0.2,g:-0.005,

// Un dușman înghețat: sprite-ul lui albăstrit, prins într-un bloc de gheață translucid (cu luciu sus-stânga).
// În ultima secundă tremură și gheața crapă — urmează să-și revină.
function drawFrozen(e,sx){
  const sh=e.frozen<THAW_WARN&&(G.t>>1)%2?1:0,f=e.dir>0?'r':'l';
  if(e.type==='man')ctx.drawImage((e.boy?BOY:MAN).ICE[f],sx-3+sh,Math.round(e.y-2));
  else ctx.drawImage(BOMB.ICE[f],sx-2+sh,Math.round(e.y-4));
  const x=sx-2+sh,y=Math.round(e.y)-3,w=e.w+4,h=e.h+3;
  ctx.globalAlpha=0.45;ctx.fillStyle='#bfeaff';ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;
  ctx.fillStyle='#5aa8d8';ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);
  ctx.fillStyle='#ffffff';ctx.fillRect(x+1,y+1,w-2,1);ctx.fillRect(x+1,y+1,1,h-2);ctx.fillRect(x+3,y+3,1,3);ctx.fillRect(x+w-3,y+h-5,1,2);
  if(e.frozen<THAW_WARN){ctx.fillStyle='#ffffff';[[3,6],[4,7],[4,8],[5,9],[w-4,4],[w-5,5],[w-5,6],[w-6,7]].forEach(([dx,dy])=>ctx.fillRect(x+dx,y+dy,1,1));}
}
function drawEnemy(e,cx){
  const sx=Math.round(e.x-cx);if(sx<-24||sx>W+24)return;
  if(e.frozen&&!e.dead){drawFrozen(e,sx);return;}
  if(e.type==='man'){
    const S=e.boy?BOY:MAN;
    if(e.dead===1){ctx.drawImage(S.A[e.dir>0?'r':'l'],sx-3,Math.round(e.y+e.h-8),16,8);return;}
    if(e.dead===2){ctx.drawImage(S.FLIP,sx-3,Math.round(e.y-2));return;}
    if(e.atk){
      // Sprite-urile de atac sunt mai late; când privește la stânga, corpul rămâne pe loc.
      const wind=e.atk<=MAN_WIND_T,img=(wind?MAN.WIND:MAN.STAB)[e.dir>0?'r':'l'];
      const shake=wind&&e.atk>6?((e.atk>>1)%2?1:-1):0;
      ctx.drawImage(img,sx-3-(e.dir>0?0:img.width-16)+shake,Math.round(e.y-2));
      return;
    }
    const f=(e.vx!==0&&(Math.floor(e.anim/7)%2))?'B':'A';
    ctx.drawImage(S[f][e.dir>0?'r':'l'],sx-3,Math.round(e.y-2));
    if(e.alert>0)txt('!',sx+3,Math.round(e.y-12),'#ff4040',1,'l','#000');
    else if(e.puzzled>0)txt('?',sx+3,Math.round(e.y-12),'#ffd23f',1,'l','#000');
  }else{
    if(e.dead){ctx.drawImage(BOMB.FLIP,sx-2,Math.round(e.y-4));return;}   // aruncată de pe ecran, cu fundul în sus
    const lit=e.lit>0,flash=lit&&((e.lit<36)?(e.lit>>1)%2:(e.lit>>3)%2);
    const step=Math.floor(e.anim/8)%2;
    const set=e.sit?(flash?BOMB.SL:BOMB.S):flash?BOMB.LA:lit?(step?BOMB.FB:BOMB.FA):e.angry?(step?BOMB.AB:BOMB.AA):(step?BOMB.B:BOMB.A);
    const shake=lit&&e.lit<36?(G.t%2?1:-1):0;
    const bx=sx-2+shake,by=Math.round(e.y-4);
    ctx.drawImage(set[e.dir>0?'r':'l'],bx,by);
    if(e.sink)return;  // stinsă în apă: fără scânteie
    // Scânteia de pe fitil (coborâtă cu 2px când stă în fund).
    const fx=bx+(e.dir>0?11:4),fy=by+(e.sit?3:1);
    if(lit&&theme.night)glow(fx,fy,6,'255,220,120',0.8);  // noaptea, scânteia de pe fitil luminează
    const sc=['#fff','#ffd23f','#ff7a1a'][(G.t>>1)%3];ctx.fillStyle=sc;ctx.fillRect(fx,fy,1,1);
    if(lit||G.t%8<4){ctx.fillRect(fx-1,fy,3,1);ctx.fillRect(fx,fy-1,1,3);}
    if(lit&&G.t%4<2){ctx.fillStyle='#fff';ctx.fillRect(fx-2,fy-2,1,1);ctx.fillRect(fx+2,fy-2,1,1);}
  }
}

function drawWorld(){
  const sh=G.shake>0?Math.round((Math.random()-0.5)*4):0;
  const cx=Math.round(cam.x)+sh;
  // În cafenea, camera dinăuntru ține loc de cer și fundal, iar toată lumea e urcată cu CAFE_VY, ca să stea camera la
  // mijlocul ecranului (tile-urile, și deci săriturile, rămân aceleași).
  const vy=inCafe()?CAFE_VY:0;ctx.save();ctx.translate(0,vy);
  if(inCafe())drawCafeRoom(cx);else drawBG();
  // Noaptea: lumea de joc (sol, blocuri, personaje, apă) se desenează pe un canvas separat, ca să primească
  // umbra albastră doar ea — fundalul are deja culori de noapte, iar luminile se pun după, nealterate.
  const night=theme.night,main=ctx;
  if(night){ctx=shadeCtx;ctx.clearRect(0,0,W,H);}
  const drawItem=it=>{
    const gx=Math.round(it.x-cx),gy=Math.round(it.y),ice=it.type==='ice',berry=it.type==='berry'||ice;
    // Aură care pulsează: aurie pentru grăunte, roșie (și mai puternică) pentru boaba de foc, albastru rece
    // pentru afina înghețată. Noaptea (și doar după ce a ieșit din bloc) e lumină adevărată, care strălucește în jur.
    if(night&&!(it.rise>0))glow(gx+5,gy+5,15+Math.sin(G.t*0.15)*1.5,ice?'140,210,255':berry?'255,80,60':'255,210,90',0.6);
    else{ctx.globalAlpha=(berry?0.34:0.28)+0.12*Math.sin(G.t*(berry?0.3:0.2));pcirc(ctx,gx+5,gy+5,9+Math.round(Math.sin(G.t*0.15)),ice?'#7fd0ff':berry?'#ff4a3a':'#ffe060');ctx.globalAlpha=1;}
    ctx.drawImage(ice?ICEBERRY:berry?BERRY:GRAIN,gx,gy);
    const a=G.t*(berry?-0.16:0.12);
    for(let k=0;k<3;k++){const ang=a+k*TAU/3;ctx.fillStyle=berry&&k%2?(ice?'#bfe8ff':'#ffd040'):'#fff';ctx.fillRect(Math.round(gx+5+Math.cos(ang)*10),Math.round(gy+5+Math.sin(ang)*10),1,1);}};
  // Noaptea bănuții strălucesc: o lumină caldă care pulsează ușor în jurul lor.
  const drawCoins=()=>coins.forEach((c,i)=>{if(c.taken||c.x-cx<=-10||c.x-cx>=W+10)return;const y=c.y+Math.round(Math.sin(G.t*0.08+i)*1);
    if(night)glow(Math.round(c.x-cx),y,13+Math.sin(G.t*0.1+i)*1.5,'255,190,70',0.6);
    drawCoin(c.x-cx,y,i*0.5);});
  if(goal){if(goal.type==='sign')drawSign(cx);else drawRestaurant(cx);}
  if(cafe)drawCafeHouse(cx);
  for(const cp of cps)drawCP(cp,cx);
  // Noaptea, bănuții și power-up-urile luminează: se desenează după umbră (vezi mai jos).
  // Doar cel care încă iese din bloc rămâne aici, ca să apară din spatele blocului.
  for(const it of items)if(!night||it.rise>0)drawItem(it);
  drawTiles(cx);
  drawPlats(cx);
  if(inCafe())drawCafeFrame(cx);   // întunericul din jurul cafenelei (peste podea), înaintea personajelor
  if(cafe)drawCafeNPC(cx);
  // Mobii chemați de boss care încă intră în poiană trec prin spatele baloților de fân și al felinarelor.
  const entering=e=>e.enter&&!e.dead;
  for(const e of enemies)if(entering(e))drawEnemy(e,cx);
  drawArena(cx);
  if(theme.snow)drawLakeBase(cx);
  if(!night)drawCoins();
  // Noaptea, bomba aprinsă luminează: nu primește umbra, se desenează după ea, cu strălucire (vezi mai jos).
  const litBomb=e=>night&&e.type==='bomb'&&e.lit>0&&!e.sink;
  for(const e of enemies)if((e.active||(e.x-cx<W+24))&&!litBomb(e)&&!entering(e))drawEnemy(e,cx);
  drawBoss(cx);
  drawPlayer(cx);
  // Decorul de pe sol stă în fața personajelor; nu pe marginea gropilor și nu sub țepi/trepte.
  if(theme.farm)drawGroundDecor(cx,theme,tx=>grid[12][tx]==='G'&&grid[11][tx]==='.'&&tileAt(tx-1,12)!=='.'&&tileAt(tx+1,12)!=='.');
  else if(theme.snow&&!inCafe())drawSnowDecor(cx,tx=>grid[12]&&grid[12][tx]==='G'&&grid[11][tx]==='.'&&!'.I'.includes(tileAt(tx-1,12))&&!'.I'.includes(tileAt(tx+1,12)));
  if(!inCafe())drawWater(cx);   // în cafenea nu e apă (la margine s-ar vedea golul de lângă ea)
  if(lakeLife)drawLakeLife(cx);
  if(night){
    // Umbra de noapte: amestecă doar pixelii desenați cu un albastru închis (mai întunecat, dar se vede tot).
    ctx.globalCompositeOperation='source-atop';ctx.fillStyle='rgba(12,18,56,0.4)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
    ctx=main;ctx.drawImage(shadeCv,0,0);
    drawNightLights(cx);
    // Strălucire portocalie care pulsează odată cu clipirea bombei și crește spre explozie.
    for(const e of enemies)if(e.active&&litBomb(e)){const fl=(e.lit<36)?(e.lit>>1)%2:(e.lit>>3)%2;
      glow(Math.round(e.x+6-cx),Math.round(e.y+(e.sit?8:6)),e.lit<36?22:17,'255,120,40',fl?0.75:0.45);drawEnemy(e,cx);}
    for(const it of items)if(!(it.rise>0))drawItem(it);
    drawCoins();
  }
  for(const f of feathers){
    // Ușoară fluturare în zbor; spre capătul distanței pana se estompează.
    const img=(f.ice?FEATHER_ICE:FEATHER)[(f.t>>2)%2?'B':'A'][f.dir>0?'r':'l'];
    ctx.globalAlpha=clamp((FEATHER_RANGE-f.dist)/28,0.35,1);
    ctx.drawImage(img,Math.round(f.x-cx),Math.round(f.y-2+Math.sin(f.t*0.6)));
    ctx.globalAlpha=1;
  }
  for(const b of booms)ctx.drawImage(BOOM[Math.min(5,b.t>>2)],Math.round(b.x-cx-42),Math.round(b.y-42));
  for(const p of parts){
    if(p.type==='coin'){drawCoin(p.x-cx,p.y,G.t*0.3);continue;}
    if(p.edge){ctx.fillStyle=p.edge;ctx.fillRect(Math.round(p.x-cx)-1,Math.round(p.y)-1,p.s+2,p.s+2);}
    ctx.globalAlpha=p.max?Math.min(1,p.life/(p.max*0.5)):1;ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x-cx),Math.round(p.y),p.s,p.s);ctx.globalAlpha=1;
  }
  if(theme.snow&&!inCafe())drawSnowfall();
  for(const p of popups)txt(p.s,p.x-cx,p.y,p.c,1,'c','#000');
  if(cafe)drawCafeHints(cx);
  if(TEST&&G.showHB)drawHitboxes(cx);
  ctx.restore();
  drawTalk();   // caseta de dialog (lower third), fixă pe ecran
  // Intrarea / ieșirea din cafenea: ecranul se întunecă și se luminează la loc (HUD-ul rămâne).
  if(G.doorT>0){ctx.fillStyle=`rgba(13,11,20,${1-Math.abs(G.doorT-DOOR_T/2)/(DOOR_T/2)})`;ctx.fillRect(0,0,W,H);}
}
// Luminile nopții, peste umbră: conul felinarului fiecărui fermier (galben cald; portocaliu când te-a văzut),
// felinarul care pâlpâie, apoi licuricii.
function drawNightLights(cx){
  for(const e of enemies){
    if(e.type!=='man'||e.boy||!e.active||e.dead||e.sink||e.frozen)continue;  // ucenicul n-are felinar; înghețat, felinarul e stins
    const l=lanternPos(e),lx=Math.round(l.x-cx),ly=Math.round(l.y);
    if(lx<-LANTERN_LEN||lx>W+LANTERN_LEN)continue;
    const col=e.chasing?'255,150,90':'255,220,130',a0=e.dir>0?0:Math.PI;
    const gr=ctx.createRadialGradient(lx,ly,2,lx,ly,LANTERN_LEN);
    gr.addColorStop(0,`rgba(${col},0.3)`);gr.addColorStop(1,`rgba(${col},0)`);
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(lx,ly);ctx.arc(lx,ly,LANTERN_LEN,a0-LANTERN_HALF,a0+LANTERN_HALF);ctx.closePath();ctx.fill();
    ctx.globalCompositeOperation='source-over';
    const fl=0.8+0.2*Math.sin(G.t*0.3+e.x);
    glow(lx,ly,8*fl,'255,210,110',0.7);
    ctx.fillStyle='#2a2018';ctx.fillRect(lx,ly-5,1,2);ctx.fillRect(lx-1,ly-3,3,1);ctx.fillRect(lx-2,ly-2,1,4);ctx.fillRect(lx+2,ly-2,1,4);ctx.fillRect(lx-1,ly+2,3,1);
    ctx.fillStyle=fl>0.9?'#fff4c0':'#ffd56a';ctx.fillRect(lx-1,ly-2,3,4);
  }
  if(!theme.snow)drawFireflies(cx);   // iarna nu sunt licurici
  drawBossLight(cx);
  drawRestaurantLights(cx);
}
// Licurici ici-colo, aproape de sol: plutesc încet și se aprind/sting pe rând (cu puțină paralaxă).
function drawFireflies(cx){
  for(let i=0;i<14;i++){const h=vhash(i,321);
    let sx=((h%520)-cx*0.9)%520;if(sx<0)sx+=520;sx=Math.round(sx-40+Math.sin(G.t*0.013+i)*10);
    const sy=Math.round(150+((h>>>8)%40)+Math.sin(G.t*0.021+i*2)*6),a=0.5+0.5*Math.sin(G.t*0.06+i*1.7);
    if(a<0.15||sx<-4||sx>W+4)continue;
    glow(sx,sy,5,'200,255,110',0.7*a);ctx.globalAlpha=a;ctx.fillStyle='#f4ffb0';ctx.fillRect(sx,sy,1,1);ctx.globalAlpha=1;

// Lumină „aditivă” (se adună peste ce e dedesubt) care se stinge spre margini — ca strălucirea să pară
// lumină, nu o pată gri (un galben transparent peste albastru-închis iese gri).
function glow(x,y,r,rgb,a){
  const gr=ctx.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(0.45,`rgba(${rgb},${a*0.35})`);gr.addColorStop(1,`rgba(${rgb},0)`);
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalCompositeOperation='source-over';
}

function standRow(x){
  for(let y=0;y<ROWS;y++){const t=tileAt(x,y);if(t==='K')continue;   // (tavanul cafenelei nu e un loc de stat)
    if(solid(t)||t==='=')return y<2||t==='^'||(t==='I'&&iceHole[x]>0)?-1:y;}
  return -1;
}
// Mută curcanul pe coloana tx (click pe harta din panou); dacă acolo nu se poate sta, pe cea mai apropiată coloană bună.
function testTeleport(tx){
  if(G.state!=='play'||player.dead||!isFinite(tx))return;
  tx=clamp(Math.floor(tx),1,cols-2);
  for(let d=0;d<40;d++)for(const x of d?[tx+d,tx-d]:[tx]){
    if(x<1||x>cols-2)continue;
    const y=standRow(x);if(y<0)continue;
    const p=player;p.x=x*TS+(TS-p.w)/2;p.y=y*TS-p.h;p.vx=0;p.vy=0;p.onGround=false;
    feathers=[];cam.x=clamp(p.x+p.w/2-W*0.42,0,cols*TS-W);
    // În nivelul bonus, un click pe camera cafenelei te duce înăuntru (cu camera pe ea), altfel ești afară.
    G.inCafe=!!cafe&&p.x>=cafe.a*TS;if(G.inCafe)cam.x=cafe.a*TS+CAFE_CAMX;
    dust(p.x+p.w/2,p.y+p.h,6);
    return;
  }
}
// Forma curcanului, aleasă din panou: mic, mare, de foc sau de gheață (cu animația de transformare din joc).
function testForm(f){
  if(G.state!=='play'||player.dead)return;
  const p=player,x=p.x+p.w/2,y=p.y;
  if(f==='small'){p.fire=false;p.ice=false;if(p.big){setBig(false);G.morph='size';G.growT=48;sfx.shrink();}}
  else if(f==='big'){if(!p.big)powerUp(x,y);else if(p.fire||p.ice){G.morph=p.fire?'fire':'ice';p.fire=false;p.ice=false;G.growT=48;sfx.shrink();}}
  else if(f==='fire')powerFire(x,y);
  else if(f==='ice')powerIce(x,y);
}
// Pune un mob nou pe sol, la ~6 tile-uri în fața curcanului, cu fața spre el.
function testSpawn(type){
  if(G.state!=='play'||player.dead)return null;
  const tx=clamp(Math.floor((player.x+player.w/2+player.face*96)/TS),1,cols-2);
  let ty=Math.max(0,Math.floor(player.y/TS));
  while(ty<ROWS&&!solid(tileAt(tx,ty))&&tileAt(tx,ty)!=='=')ty++;   // și pe scânduri
  if(ty>=ROWS)return null;
  const e=makeEnemy(type,tx,ty-1);e.active=true;e.dir=-player.face;enemies.push(e);
  return e;
}
const TEST_CMDS={
  // Panoul s-a încărcat: îi trimitem nivelurile, pozele, iconițele și harta nivelului de acum.
  hello(){testHello();testMap();},
  // Un nivel adevărat (level 0-3) sau arena într-un decor (arena = indexul din THEMES), de la început.
  level(d){
    if(d.arena!==undefined){const t=d.arena|0;if(!THEMES[t])return;TEST_LEVEL.theme=t;TEST_LEVEL.song=ARENA_SONG[t];testLoad(ARENA,0);}
    else testLoad(clamp(d.level|0,0,ARENA-1),0);},
  // Nivelul de acum, de la început (cp=0) sau de la un punct de salvare (cp=1, 2).
  from(d){testLoad(G.level,d.cp|0);},
  // Repornește de unde ai reapărea dacă ai muri (ultimul punct de salvare atins), cu aceeași formă (tasta R).
  reset(){const alive=!player.dead;G.carryBig=alive&&player.big;G.carryFire=alive&&player.fire;G.carryIce=alive&&player.ice;startLevel();},
  tp(d){testTeleport(+d.x);},
  form(d){testForm(d.form);},
  boy(){testSpawn('boy');},
  man(){testSpawn('man');},
  bomb(){testSpawn('bomb');},
  sitbomb(){const e=testSpawn('bomb');if(e)sitBomb(e);},
  clear(){enemies=[];},
  god(){G.god=!G.god;},
  hitbox(){G.showHB=!G.showHB;},
  speed(d){G.speed=[1,0.5,0.25].includes(d.v)?d.v:1;},
  pause(){if(G.state!=='play')return;G.paused=!G.paused;sfx.pause();applyAudio();},
  // Un singur cadru: dacă jocul merge, întâi îl pune pe pauză.
  step(){if(G.state!=='play')return;if(!G.paused){G.paused=true;sfx.pause();applyAudio();}else G.stepOnce=true;},
};
if(TEST)addEventListener('message',e=>{
  // Doar comenzi de la pagina care ne-a deschis (test.html), din același loc.
  if(e.source!==window.parent||!(location.protocol==='file:'||e.origin===location.origin))return;
  const d=e.data;if(!d||!Object.prototype.hasOwnProperty.call(TEST_CMDS,d.cmd)||!player)return;
  TEST_CMDS[d.cmd](d);
});
const toParent=msg=>{if(window.parent!==window)window.parent.postMessage(msg,'*');};
// Pozele pentru cardurile de nivel din panou: partea de jos a primului ecran (sol, blocuri, curcanul), desenată chiar
// cu desenul jocului. Se fac o dată, la pornire: fiecare nivel, plus arena în fiecare decor.
let TEST_THUMBS=null;
function testThumbs(){
  const [c,g]=mkCanvas(256,128);
  const shot=()=>{ctx.imageSmoothingEnabled=false;drawWorld();g.clearRect(0,0,256,128);g.drawImage(cv,0,96,256,128,0,0,256,128);return c.toDataURL();};
  const out={levels:[],arena:{}},t0=TEST_LEVEL.theme;
  G.cp=null;G.carryBig=false;G.carryFire=false;G.carryIce=false;
  for(let i=0;i<ARENA;i++){G.level=i;startLevel(true);out.levels.push(shot());}
  for(const t of ARENA_THEMES){TEST_LEVEL.theme=t;G.level=ARENA;startLevel(true);out.arena[t]=shot();}
  TEST_LEVEL.theme=t0;TEST_THUMBS=out;
}
// O dată, la cererea panoului: nivelurile (nume, decor, câte puncte de salvare), pozele și iconițele (sprite-urile
// din joc), ca butoanele din panou să arate exact ca jocul.
function testHello(){
  const u=c=>c.toDataURL();
  const levels=LEVELS.slice(0,ARENA).map((d,i)=>({name:THEMES[d.theme].name,theme:d.theme,cps:d.build().cps.length,
    bonus:!!d.bonus,num:d.bonus?'★':String(levelNum(i))}));
  toParent({hello:{version:GAME_VERSION,levels,arenaTheme:TEST_LEVEL.theme,thumbs:TEST_THUMBS,
    icons:{tks:u(TKS.A.r),tk:u(TK.A.r),tkf:u(TKF.A.r),tki:u(TKI.A.r),boy:u(BOY.A.l),man:u(MAN.A.l),bomb:u(BOMB.A.l),sit:u(BOMB.S.l),head:u(HEAD)}}});
}
// Harta nivelului pentru panou, la fiecare pornire de nivel: rândurile de tile-uri, punctele de salvare, ținta și
// culorile decorului. Panoul o desenează mică, sub joc; un click pe ea mută curcanul acolo (comanda tp).
function testMap(){
  const def=LEVELS[G.level],th=theme;
  toParent({map:{level:G.level,arena:!!def.arena,bonus:!!def.bonus,num:def.arena?0:levelNum(G.level),theme:def.theme,name:th.name,cols,rows:grid.map(r=>r.join('')),
    cps:cps.map(c=>c.tx),goal,colors:{sky:th.sky,grass:th.grass,dirt:th.dirt,water:th.water.body,night:!!th.night},
    plats:plats.map(p=>({kind:p.kind,x:p.x0/TS,y:p.y0/TS,w:p.w/TS,ax:p.ax,range:p.range/TS}))}});
}
// Starea, de 10 ori pe secundă: ce e pornit (pentru butoanele din panou) și unde sunt curcanul, camera și mobii
// (în tile-uri, pentru hartă). cp = punctul de unde reapari (0 = început).
function testStatus(){
  if(!player)return;
  const p=player,r1=v=>Math.round(v*10)/10;
  toParent({status:{level:G.level,state:G.state,form:!p.big?'small':p.fire?'fire':p.ice?'ice':'big',
    god:!!G.god,hitbox:!!G.showHB,speed:G.speed||1,paused:!!G.paused,
    px:r1((p.x+p.w/2)/TS),py:r1((p.y+p.h)/TS),cam:r1(cam.x/TS),view:W/TS,
    cp:G.cp&&G.cp.level===G.level?cps.findIndex(c=>c.tx===G.cp.x)+1:0,cpOn:cps.map(c=>c.on),
    mobs:enemies.filter(e=>!e.dead&&!e.remove).map(e=>[r1((e.x+e.w/2)/TS),r1((e.y+e.h)/TS),e.frozen?'f':e.type==='bomb'?'b':e.boy?'u':'m'])
      .concat(boss&&(bossFighting()||boss.st==='wait')?[[r1((boss.x+boss.w/2)/TS),r1((boss.y+boss.h)/TS),'B']]:[])}});
}
// Contururile hitbox-urilor: verde = curcan, roșu = fermier, alb = ucenic, portocaliu = bombă, mov = furca (cât lovește),
// galben = zona solidă a bombei în fund (dacă e mai mare decât hitbox-ul), albastru = power-up, portocaliu deschis = pene.
function drawHitboxes(cx){
  ctx.lineWidth=1;
  const r=(o,col)=>{ctx.strokeStyle=col;ctx.strokeRect(Math.round(o.x-cx)+0.5,Math.round(o.y)+0.5,Math.max(1,Math.round(o.w)-1),Math.max(1,Math.round(o.h)-1));};
  if(player&&!player.dead)r(player,'#00ff66');
  for(const e of enemies){if(!e.active||e.dead||e.remove)continue;
    r(e,e.type==='man'?(e.boy?'#ffffff':'#ff4040'):'#ffa000');
    if(e.type==='man'&&e.atk>MAN_WIND_T&&e.atk-MAN_WIND_T<=10)r(forkBox(e),'#ff40ff');
    if(e.type==='bomb'&&e.sit&&BOMB_PUSH_PAD)r({x:e.x-BOMB_PUSH_PAD,y:e.y,w:e.w+BOMB_PUSH_PAD*2,h:e.h},'#ffff40');}
  for(const it of items)r(it,'#40c0ff');
  for(const f of feathers)r(f,'#ffc080');
  for(const p of plats)if(p.solid)r(p,'#40ffd0');
  if(bossFighting()||(boss&&boss.st==='wait')){r(boss,'#ff4040');for(const f of boss.forks)if(!f.stuckT)r(forkTip(f),'#ff40ff');
    if(boss.st==='strike'&&boss.ext>0)r(bossStrikeBox(),'#ff40ff');}
}

// ================= LOOP =================
let last=performance.now(),acc=0;
const STEP=1000/60;
function frame(now){
  acc+=Math.min(100,now-last)*(G.speed||1);last=now;
  while(acc>=STEP){update();acc-=STEP;}
  render();requestAnimationFrame(frame);
}
if(TEST){testThumbs();G.level=ARENA;startLevel();}
else playSong('title');
requestAnimationFrame(frame);
</script>
